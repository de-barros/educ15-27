project:
  type: website
  render:
    - "*.qmd"
    - "!slides/"
    - "!README.qmd"
  resources:
    - "files/"
    - "simulator/*.html"
    - "simulator/*.js"
    - "simulator/*.css"
    - "slides/*.html"
    - "slides/*.pdf"
    - "slides/css/"
    - "slides/libs/"
    - "slides/img/"
    - "slides/*_files/"
  preview:
    port: 3333

execute:
  freeze: auto  # Re-render only when source changes

bibliography: files/bib/references.bib
csl: files/bib/chicago-author-date.csl

website:
  title: "EDUC 15"
  description: "Read, interpret, and draw conclusions from quantitative education research"
  site-url: "https://educ15.de-barros.com/"

  favicon: "/files/icon-512.png"

  repo-url: "https://github.com/de-barros/educ15-27"
  repo-actions: [edit, issue]

  page-navigation: true

  navbar:
    pinned: true
    background: "#0064a4"
    right:
      - syllabus.qmd
      - schedule.qmd
      - text: "Content"
        file: content/index.qmd
      - text: "Assignments"
        file: assignment/index.qmd
      - text: "Simulator"
        file: resource/simulator.qmd
      - text: "Resources"
        file: resource/index.qmd
      - text: "{{< iconify simple-icons canvas >}}<span class='visually-hidden'>Canvas</span>"
        href: "https://canvas.eee.uci.edu/"
        aria-label: Canvas

  sidebar:
    - title: "Content"
      style: "docked"
      search: false
      background: dark
      contents:
        - section: "Overview"
          contents:
            - content/index.qmd
        - section: "Topics"
          contents:
            - text: "1: Introduction and measurement"
              file: content/01-content.qmd
            - text: "2: Displaying data"
              file: content/02-content.qmd
            - text: "3: Central tendency and variability"
              file: content/03-content.qmd
            - text: "4: z-scores"
              file: content/04-content.qmd
            - text: "5: Probability"
              file: content/05-content.qmd
            - text: "6: Sampling distributions"
              file: content/06-content.qmd
            - text: "7: Hypothesis testing"
              file: content/07-content.qmd
            - text: "8: Introduction to the t-test"
              file: content/08-content.qmd
            - text: "9: t-tests for two samples and for gains"
              file: content/09-content.qmd
            - text: "10: ANOVA"
              file: content/10-content.qmd
            - text: "11: Correlation"
              file: content/11-content.qmd
            - text: "12: Regression: the line"
              file: content/12-content.qmd
            - text: "13: Regression: is the slope real?"
              file: content/13-content.qmd
            - text: "14: Regression: groups and interactions"
              file: content/14-content.qmd

    - title: "Assignments"
      contents:
        - section: "Assignments"
          contents:
            - assignment/index.qmd

    - title: "Resources"
      contents:
        - section: "Overview"
          contents:
            - resource/index.qmd
        - section: "Statistics simulator"
          contents:
            - text: "Sampling distributions"
              file: resource/simulator.qmd
            - text: "Power"
              file: resource/simulator-power.qmd
            - text: "Confidence intervals"
              file: resource/simulator-intervals.qmd
            - text: "Correlation and regression"
              file: resource/simulator-correlation.qmd
        - text: "Data"
          file: resource/data.qmd

  page-footer:
    left: |
      Content {{< fa brands creative-commons >}} {{< var course.copyright_year >}} by [{{< var instructor.name_no_title >}}]({{< var instructor.url >}}) <br>
      All content licensed under a {{< fa brands creative-commons >}}
      {{< fa brands creative-commons-by >}} {{< fa brands creative-commons-nc >}}
      [Creative Commons Attribution-NonCommercial 4.0 International license (CC BY-NC 4.0)](https://creativecommons.org/licenses/by-nc/4.0/),
      except the [Mindspark data](/resource/data.qmd), which are CC BY 4.0
    right: |
      Made with {{< fa brands r-project >}} and [Quarto](https://quarto.org/)<br>
      [View the source at {{< fa brands github >}} GitHub]({{< var course.github >}})

format:
  html:
    theme:
      - litera
      - html/custom.scss
    toc: true
    highlight-style: monokai
    # Names the search box and button that Quarto's search widget leaves unlabeled
    include-after-body: html/a11y-search.html
