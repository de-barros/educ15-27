project:
  type: website
  render:
    - "*.qmd"
    - "!slides/"
    - "!README.qmd"
  resources:
    - "files/"
  preview:
    port: 3333

execute:
  freeze: auto  # Re-render only when source changes

bibliography: files/bib/references.bib
csl: files/bib/chicago-author-date.csl

website:
  title: "EDUC 15"
  description: "Read, interpret, and draw conclusions from quantitative education research"
  site-url: "https://educ15.de-barros.com/"

  favicon: "/files/icon-512.png"

  repo-url: "https://github.com/de-barros/educ15-27"
  repo-actions: [edit, issue]

  page-navigation: true

  navbar:
    pinned: true
    background: "#0064a4"
    right:
      - syllabus.qmd
      - schedule.qmd
      - text: "Content"
        file: content/index.qmd
      - text: "Assignments"
        file: assignment/index.qmd
      - text: "Resources"
        file: resource/index.qmd
      - text: "{{< iconify simple-icons canvas >}}<span class='visually-hidden'>Canvas</span>"
        href: "https://canvas.eee.uci.edu/"
        aria-label: Canvas

  sidebar:
    - title: "Content"
      style: "docked"
      search: false
      background: dark
      contents:
        - section: "Overview"
          contents:
            - content/index.qmd

    - title: "Assignments"
      contents:
        - section: "Assignments"
          contents:
            - assignment/index.qmd

    - title: "Resources"
      contents:
        - section: "Overview"
          contents:
            - resource/index.qmd

  page-footer:
    left: |
      Original content {{< fa brands creative-commons >}} {{< var course.copyright_year >}} by [{{< var attribution.name_no_title >}}]({{< var attribution.url >}}) <br>
      Additional content {{< fa brands creative-commons >}} {{< var course.copyright_year >}} by [{{< var instructor.name_no_title >}}]({{< var instructor.url >}}) <br>
      All content licensed under a {{< fa brands creative-commons >}}
      {{< fa brands creative-commons-by >}} {{< fa brands creative-commons-nc >}}
      [Creative Commons Attribution-NonCommercial 4.0 International license (CC BY-NC 4.0)](https://creativecommons.org/licenses/by-nc/4.0/)
    right: |
      Made with {{< fa brands r-project >}} and [Quarto](https://quarto.org/)<br>
      [View the source at {{< fa brands github >}} GitHub]({{< var course.github >}})

format:
  html:
    theme:
      - litera
      - html/custom.scss
    toc: true
    highlight-style: monokai
    # Names the search box and button that Quarto's search widget leaves unlabeled
    include-after-body: html/a11y-search.html
