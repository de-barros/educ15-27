# The gaps pile up around zero

&lt;div class="sim-slide" style="height: 505px;"&gt;
&lt;iframe class="sim-live" src="../simulator/index.html?ui=slide&amp;step=4&amp;n=10&amp;mu=16&amp;sd=5.8&amp;view=raw&amp;draws=551&amp;seed=15" title="Simulator at step 4 with 551 pairs of samples of ten and no true difference. Panel 3 shows the differences in means stacked in a bell shape centered on zero, with most between about minus 6 and 6." loading="lazy"&gt;&lt;/iframe&gt;
&lt;img class="sim-static" src="img/sim/74c5e5346445.png" alt="Simulator at step 4 with 551 pairs of samples of ten and no true difference. Panel 3 shows the differences in means stacked in a bell shape centered on zero, with most between about minus 6 and 6."&gt;
&lt;/div&gt;

.source[Simulator after Kristoffer Magnusson, rpsychologist.com.]

???

Same world, 551 draws. The center is zero, because H₀ is true. Point at the spread: about 2.6 points is a typical miss. That's the standard error of the difference.

Mindspark's gap of 2.69 wouldn't be strange with groups of 10. But Mindspark's groups aren't that small.

---

# A gap has its own standard error

&lt;div class="math-display"&gt;\[
\sigma_{M_1 - M_2} = \sqrt{\frac{\sigma^2}{n_1} + \frac{\sigma^2}{n_2}}
\]&lt;/div&gt;

.pull-left[
.box-inv-1.small[Variances add, even when the means subtract. Each sample brings its own error]
]

.pull-right[
.box-inv-1.small[Here: √(33.64 / 10 + 33.64 / 10) = 2.59. With n = 200 each, it's 0.58]
]

.box-1.small[We're assuming both populations share one σ. Keep that in mind]

???

σ_M from Topic 6 was σ / √n. Square it and it's σ² / n. Here there are two of those, one per sample.

This is why two groups need more people than one. To get the same standard error as one mean with n students, each group needs 2n students. That's four times as many in total, as Topic 7 promised.

---

# When the groups differ, the pile moves

&lt;div class="sim-slide" style="height: 505px;"&gt;

# The two-sample t

---

layout: true
class: title title-6

---

# In real research, panel 1 goes dark again

&lt;div class="sim-slide" style="height: 505px;"&gt;
&lt;iframe class="sim-live" src="../simulator/index.html?ui=slide&amp;step=4&amp;n=10&amp;mu=16&amp;sd=5.8&amp;view=stat&amp;hide=1&amp;draws=551&amp;seed=15" title="Simulator at step 4 in the t view with panel 1 greyed out and marked with a question mark. Panel 2 shows one sample from each group with a t-score. Panel 3 stacks t-scores along a t curve with 18 degrees of freedom." loading="lazy"&gt;&lt;/iframe&gt;
&lt;img class="sim-static" src="img/sim/c912a50e3d80.png" alt="Simulator at step 4 in the t view with panel 1 greyed out and marked with a question mark. Panel 2 shows one sample from each group with a t-score. Panel 3 stacks t-scores along a t curve with 18 degrees of freedom."&gt;
&lt;/div&gt;

.source[Simulator after Kristoffer Magnusson, rpsychologist.com.]

???

Just like Topic 8. We can't see σ, so we estimate it, and z becomes t. With two groups of 10, df is 18: each group gives 9.

---

# The fraction keeps its shape

&lt;div class="math-display"&gt;\[
t = \frac{M - \mu}{\hat{\sigma}_M}
\qquad \text{becomes} \qquad
t = \frac{(M_1 - M_2) - (\mu_1 - \mu_2)}{\hat{\sigma}_{M_1 - M_2}}
\]&lt;/div&gt;

.pull-left[
.box-inv-6.small[Top: the gap we saw, minus the gap H₀ claims. Under H₀, that second part is 0]
]

.pull-right[
.box-inv-6.small[Bottom: how far a gap typically falls. We have to estimate it]
]

.book-tag[In the book: σ̂&lt;sub&gt;M₁−M₂&lt;/sub&gt; is written s&lt;sub&gt;M₁−M₂&lt;/sub&gt;]

???

Same logic as every test so far: what we saw, over what sampling error alone would give us.

---

# Pool the two estimates of σ²

&lt;div class="math-display"&gt;\[
\hat{\sigma}_p^2 = \frac{SS_1 + SS_2}{df_1 + df_2}
\]&lt;/div&gt;

.pull-left[
.box-inv-6.small[We assume one σ², so we pool: add up the squared deviations and the df]
]

.pull-right[
.box-inv-6.small[A bigger group holds more information, so it counts for more]
]

.box-6.small[The p is for "pooled". With equal n, it's the plain average of the two variances]

.book-tag[In the book: σ̂²&lt;sub&gt;p&lt;/sub&gt; is written s²&lt;sub&gt;p&lt;/sub&gt;]

???

Topic 3's σ̂² is SS / df. This is the same recipe with two groups: all the squared deviations, over all the degrees of freedom.

The assumption has a name, homogeneity of variance. The test also needs independent observations, and roughly normal populations unless the samples are large. Software can drop the equal-variance assumption, in a version called Welch's t. With Mindspark, it barely changes t.

---

# Then the bottom of the fraction, and df

&lt;div class="math-display"&gt;\[
\hat{\sigma}_{M_1 - M_2} = \sqrt{\frac{\hat{\sigma}_p^2}{n_1} + \frac{\hat{\sigma}_p^2}{n_2}}
\qquad\qquad
df = (n_1 - 1) + (n_2 - 1)
\]&lt;/div&gt;

.pull-left[
.box-inv-6.small[Same formula as before, with the pooled estimate in place of σ²]
]

.pull-right[
.box-inv-6.small[Each sample spends one df on its own mean]
]

.box-6.small[Three moves: pool the variance, find the standard error, compute t]

???

The most common slip is using n1 + n2 − 1 for df. There are two means, so two df are spent.

# Steps 1 and 2: set up the test

.box-3.small.sp-after-half[At endline, do math scores differ across the two groups?]

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; Step &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; In words &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; In symbols &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 1. State H₀ &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; The two population means don't differ &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; μ&lt;sub&gt;Mindspark&lt;/sub&gt; − μ&lt;sub&gt;control&lt;/sub&gt; = 0 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 2. Set the criteria &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; α = 0.05, two tails, and σ is unknown &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; df = (266 − 1) + (273 − 1) = 537 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt;  &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Reject H₀ if t is beyond the cutoffs &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; t(537) beyond ±1.964 &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

The df matter here: 266 + 273 − 2 = 537. With this many people, the cutoff is nearly 1.96. The book's table stops short of 537, so use the next lower df, or the z cutoff.

# Step 3: three moves

&lt;table class="deck-table tight"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt;   &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; n &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; M &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; SS &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Mindspark &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 266 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 18.68 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 9107.5 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Control &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 273 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 15.99 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 9060.0 &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-inv-3.small[Pool: σ̂²&lt;sub&gt;p&lt;/sub&gt; = (9107.5 + 9060.0) / 537 = **33.83**]

.box-inv-3.small[Standard error: σ̂&lt;sub&gt;M₁−M₂&lt;/sub&gt; = √(33.83 / 266 + 33.83 / 273) = **0.50**]

.box-3.small[Compute t: (18.68 − 15.99) / 0.50 = **5.37**]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

In 2024's deck, df appeared as 573 on two slides. It's 537. Sums of squares like these come from a spreadsheet, with the computational formula from Topic 3. Lab 7 does this on the full data.

---

# Step 4: our t is far past the cutoff

&lt;img src="09-two-samples-gains_files/figure-html/decision-plot-1.png" alt="A t curve with 537 degrees of freedom, with small shaded tails beyond plus and minus 1.964. A vertical line marks our t of 5.37, far to the right of the cutoff, where the curve has almost no height." width="92%" style="display: block; margin: auto;" /&gt;

.box-3.small[5.37 is beyond 1.964, so we reject H₀. p is below 0.001]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

If the two populations were the same, a gap this large would almost never happen. So we reject H₀. That doesn't say how big the effect is, so that comes next.

---

# How big is the gap? g = 0.46

&lt;div class="math-display"&gt;\[
d = \frac{\mu_1 - \mu_2}{\sigma}
\qquad \text{is estimated by} \qquad
g = \frac{M_1 - M_2}{\hat{\sigma}_p}
\]&lt;/div&gt;

.box-inv-3.small.sp-after-half[σ̂&lt;sub&gt;p&lt;/sub&gt; = √33.83 = 5.82, so g = 2.69 / 5.82 = **0.46**]

.box-3.small[The groups sit about half an SD apart. Remember Topic 7: that's large for education]

.book-tag[In the book: g is called the estimated Cohen's d]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Same as Topic 8: g is in people's SDs, not in standard errors, so n isn't in the formula. Use the pooled SD, not the standard error of the gap.

Topic 7's table from Kraft put the median effect at 0.10 SD. Please keep ignoring the book's Table 8.2 here.

---

# The interval for a gap

&lt;img src="09-two-samples-gains_files/figure-html/ci-plot-1.png" alt="A number line of possible values of the population gap, with a point at 2.69 and a bar from 1.71 to 3.68. A dashed line marks zero, the H0 value, well to the left of the bar." width="84%" style="display: block; margin: auto;" /&gt;

.box-inv-3.small.sp-after-half[Estimate ± margin of error: 2.69 ± 1.964 × 0.501 = [1.71, 3.68]]

.box-3.small[The interval leaves out 0, so it agrees with the test: reject H₀]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Same move as Topic 8: estimate plus or minus a cutoff times a standard error. In H₀'s world, the gap is 0, and 0 isn't inside.

Starting from unrounded numbers, the interval is 1.707 to 3.676. By hand with 2.69 and 0.50, it comes out at 1.71 to 3.67.

---

.box-3.medium.sp-after-half[In words]

.box-inv-3.small.sp-after-half[At endline, Mindspark students scored 2.69 points higher in math than control students. The difference is statistically significant at the 0.05 level, t(537) = 5.37, g = 0.46, with a 95% confidence interval of [1.71, 3.68]]

.box-3.small[The test, the effect size and the interval: all three, as in Topic 8]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Because a lottery split the groups, this gap can be read as the program's effect, for these students. We'll come back to why on Tuesday.

# A paired test is a one-sample t on gains

&lt;div class="math-display"&gt;\[
t = \frac{M - \mu}{\hat{\sigma}_M}
\qquad \text{where} \qquad
\hat{\sigma}_M = \frac{\hat{\sigma}}{\sqrt{n}}
\]&lt;/div&gt;

.pull-left[
.box-inv-5.small[There's no new formula. This is Topic 8's, and now X is a person's gain]
]

.pull-right[
.box-inv-5.small[M is the mean gain, and n is the number of people. H₀ says μ = 0, so df = n − 1]
]

.box-5.small[H₀: on average, nothing changes between before and after]

.book-tag[In the book: a gain is D, and our M and σ̂&lt;sub&gt;M&lt;/sub&gt; are M&lt;sub&gt;D&lt;/sub&gt; and s&lt;sub&gt;M&lt;sub&gt;D&lt;/sub&gt;&lt;/sub&gt;]

???

Here's the good news of the day. Whatever you can do with a one-sample t, you can do with gains: g, intervals, one tail or two. n counts people, not scores. A common slip is using 2n.

# Pairing has a price

.pull-left[
.box-7.medium[What we gain]

.box-inv-7.small[Each person is their own comparison]

.box-inv-7.small[A smaller standard error]

.box-inv-7.small[Fewer people for the same power]
]

.pull-right[
.box-7.medium[What we risk]

.box-inv-7.small[Time passes between the two scores]

.box-inv-7.small[Anything that changed gets mixed into the gain]

.box-inv-7.small[The test can't say what caused it]
]

???

The test can tell us that scores changed. It can't tell us why. The book calls these time-related factors and order effects, and it covers counterbalancing, which swaps the order of conditions. A pretest and posttest can't be swapped.

???

The last one is specific to our data. The endline tests were different from the baseline test, out of 34 or 35 by grade band, so a raw gain can't be read as pure learning.

The scaled scores in the data hint at how much that matters. In baseline SDs, control students gained 0.35, against about 1.21 in raw points. If those scales are linked across rounds, which the codebook doesn't say, the new test accounts for a good part of the raw gain.

# Both groups rose, one rose more

.box-4.small.sp-after-half[7.82 / 2.69 = **2.9**: nearly three times the program's effect]

.box-inv-4.small[The paired test isn't wrong. It asks if scores changed, not why]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Be careful with the words. Every number here is right. The mistake is reading a gain as an effect.

---

# Why doesn't 7.82 − 4.74 give 2.69?

.box-inv-4.small.sp-after-half[Subtracting gains gives 3.09, a two-sample t on gains: t(537) = 7.15]

.box-inv-4.small.sp-after-half[It differs from 2.69 by 0.40: the gap at baseline, which favored the control group by chance]

.box-4.small.sp-after-half[Both are fair estimates, because both compare with the control group]

.box-inv-4.small[The endline gap ignores baseline. Gains use it, so their standard error is smaller: 0.43, not 0.50]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

A student will do this subtraction, so get ahead of it. By hand, the rounded numbers give 3.08. Unrounded, it's 3.09. A fair lottery doesn't make groups identical, as we saw in Topic 6. Among these 539 students, the baseline gap of 0.40 points isn't significant.

The two estimates, 2.69 and 3.09, give the same story, and this is the same two-sample test from Thursday, with gains as the scores. Regression later in the course gives a third way to use baseline.

---

# This is why control groups exist

.box-4.medium.sp-after-half[What would have happened without the program?]

.box-inv-4.small.sp-after-half[We can't watch the same students both with and without Mindspark]

.box-inv-4.small.sp-after-half[The lottery gave us the next best thing: similar students, who lived through the same months]

.box-4.small[The control group's rise is what would have happened anyway. Whatever goes beyond it is the program]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

This is the idea behind the whole study. The word for that missing world is the counterfactual. School, growing up and the new test all hit both groups. The only thing the lottery let differ was the program.
