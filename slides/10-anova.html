# Why not more t-tests?

---

layout: true
class: title title-1

---

# Three centers, three means

&lt;img src="10-anova_files/figure-html/center-plot-1.png" alt="Three histograms of baseline math scores, one per Mindspark center. All three are bell-shaped, span about the same scores, and overlap almost fully. The means are 11.67 in Chhatarpur, 11.60 in Govindpuri and 10.78 in Tekhand." width="90%" style="display: block; margin: auto;" /&gt;

.box-inv-1.small[Did the centers differ before the program, or is this sampling error?]

.source[Data: Muralidharan, Singh, and Ganimian (2019). 619 students at baseline.]

???

These are the three after-school centers from Topic 1. Children weren't sorted into them by a lottery, so a gap here would be a difference, not an effect. A real worry too: if centers start out different, that matters for reading anything later.

---

# More tests, more false alarms

&lt;img src="10-anova_files/figure-html/inflation-plot-1.png" alt="A rising curve of points. The x axis is the number of tests, from 1 to 10. The y axis is the chance of at least one false alarm when every null hypothesis is true. It is 5 percent for one test, 14 percent for three and 40 percent for ten. A dashed line stays at 5 percent, the risk we meant to take." width="80%" style="display: block; margin: auto;" /&gt;

&lt;div class="math-display"&gt;\[
\text{Chance of at least one false alarm} = 1 - (1 - \alpha)^{\text{tests}}
\]&lt;/div&gt;

.box-1.small[Three centers need 3 t-tests, and five groups need 10]

???

A Type 1 error is a false alarm, from Topic 7. Each t-test at α = 0.05 has a 5% risk of a Type 1 error. Across three tests, the chance that at least one goes off is 1 − 0.95³ = 0.14.

That formula treats the tests as independent. Ours share groups, so it runs a little high: a simulation of three t-tests on three identical groups gives 12%, not 14%. Either way, it's well past 5%.

Number of pairs: k(k − 1) / 2, where k is the number of groups.

---

# One question about all the means

&lt;div class="math-display"&gt;\[
H_0\!: \mu_1 = \mu_2 = \mu_3
\]&lt;/div&gt;

.pull-left[
.box-inv-1.small[H₀: all population means are equal]
]

.pull-right[
.box-inv-1.small[H₁: at least one differs from another]
]

.box-1.small.sp-after-half[One test, so α stays at 0.05 for the whole question]

.pull-left[
.box-inv-1.small[**Factor:** the variable that makes the groups. Here, center]
]

.pull-right[
.box-inv-1.small[**Levels:** the groups of that factor. Here, 3 centers]
]

.book-tag[ANOVA stands for analysis of variance]

???

The test covers everything at once. Statisticians call that an omnibus test. H₁ doesn't say that all the means differ: one odd group is enough.

Two or more factors at once is a factorial design. Regression picks that up in Topic 14.

---

# Same gaps, but the spread matters

&lt;img src="10-anova_files/figure-html/spread-plot-1.png" alt="Two panels, each with three rows of dots for three groups. In both, the group means are 8, 12 and 16, marked with a tick. In the left panel, each group's dots sit tight around its mean, so the groups are clearly apart. In the right panel, each group's dots spread widely and the groups overlap heavily." width="86%" style="display: block; margin: auto;" /&gt;

.box-inv-1.small[On the left, the gaps stand out. On the right, they could be chance]

.source[After a figure in Gravetter et al., *Essentials of Statistics for the Behavioral Sciences*, 10e. Scores made up.]

???

Red ticks are the group means. This is the idea of the day, and it's the t-test's idea too: a gap only means something next to the spread.

With two groups, t compares one gap with the spread. With three or more means, there's no single gap. So ANOVA measures how spread out the means are, as a variance.

---

# F compares two variances

&lt;div class="math-display"&gt;\[
F = \frac{\text{variance between the group means}}{\text{variance within the groups}}
= \frac{MS_{\text{between}}}{MS_{\text{within}}}
\]&lt;/div&gt;

.pull-left[
.box-inv-1.small[**Top:** how far the group means sit apart. It holds any real difference, plus chance]
]

.pull-right[
.box-inv-1.small[**Bottom:** how far people sit from their own group's mean. It holds chance only]
]

.box-1.small[MS means mean square: ANOVA's word for a variance]

???

The bottom is the pooled variance from Topic 9, with three groups. It assumes one σ² across the populations, as the pooled t did.

Why chance only? Everyone in a group is treated the same way, so differences within a group can't come from the factor. Differences between groups could come from the factor, and they also carry chance: even identical populations give different sample means.

# Under H₀, F averages about 1

&lt;div class="sim-slide" style="height: 505px;"&gt;
&lt;iframe class="sim-live" src="../simulator/index.html?ui=slide&amp;step=5&amp;n=10&amp;mu=100&amp;sd=15&amp;draws=551&amp;seed=15" title="Simulator at step 5 with 551 sets of three samples of ten and no true differences. Panel 3 shows F values stacked along an F curve with 2 and 27 degrees of freedom. Most sit between 0 and 2, and about 5 percent lie beyond the cutoff near 3.35." loading="lazy"&gt;&lt;/iframe&gt;
&lt;img class="sim-static" src="img/sim/0a53e9eced13.png" alt="Simulator at step 5 with 551 sets of three samples of ten and no true differences. Panel 3 shows F values stacked along an F curve with 2 and 27 degrees of freedom. Most sit between 0 and 2, and about 5 percent lie beyond the cutoff near 3.35."&gt;
&lt;/div&gt;

.source[Simulator after Kristoffer Magnusson, rpsychologist.com.]

???

Same world, 551 draws. Most F values fall between 0 and 2, and they average about 1. F can't go below 0, because variances can't be negative, so it has one long tail to the right. With three groups, the pile is tallest near 0. About 5% of samples land past the cutoff of 3.35. That's α.

---

# When means differ, the pile moves

&lt;div class="sim-slide" style="height: 505px;"&gt;
&lt;iframe class="sim-live" src="../simulator/index.html?ui=slide&amp;step=5&amp;n=10&amp;mu=100&amp;sd=15&amp;gm=100,100,115&amp;draws=551&amp;seed=15" title="Simulator at step 5 with 551 sets of three samples of ten. The population means are now 100, 100 and 115. Panel 3 shows the F values spread far to the right of the F curve, with many of them beyond the cutoff." loading="lazy"&gt;&lt;/iframe&gt;
&lt;img class="sim-static" src="img/sim/ad6114572f0e.png" alt="Simulator at step 5 with 551 sets of three samples of ten. The population means are now 100, 100 and 115. Panel 3 shows the F values spread far to the right of the F curve, with many of them beyond the cutoff."&gt;
&lt;/div&gt;

.source[Simulator after Kristoffer Magnusson, rpsychologist.com.]

???

One group's mean moves up to 115. Only one group differs, and that's enough for H₁. The share beyond the cutoff is now power.

Use the sample size slider here. To try other means, open the full simulator, because the group boxes hide on a slide.

---

.box-inv-1.small.sp-after-half[Here σ² = 225. MS within estimates σ² in both worlds]

.box-inv-1.small.sp-after-half[MS between estimates σ² only when H₀ is true. If the means differ, it adds their real spread]

.box-1.small[So F near 1 fits H₀, and a large F is evidence against it]

???

Each row is 20,000 sets of three samples of 10, run in R. The true values are 225 for MS within, and 225 and then 975 for MS between. On the simulator's page, these are in the table "Estimates and the truth". That table is hidden on a slide, so it's copied here.

F averages a little above 1 even under H₀: exactly 27 / 25 = 1.08 here. With large samples, it's closer to 1.

# The total splits into two parts

.box-6.medium.tree-top[Total variability]

&lt;div class="tree-arrows" aria-hidden="true"&gt;&lt;span&gt;↙&lt;/span&gt;&lt;span&gt;↘&lt;/span&gt;&lt;/div&gt;

.pull-left[
.box-inv-6.medium[Between the groups]

.box-inv-6.small[Any real differences, plus chance]

.box-6.small[Goes on top of F]
]

.pull-right[
.box-inv-6.medium[Within the groups]

.box-inv-6.small[Chance only]

.box-6.small[Goes on the bottom of F]
]

.source[After a figure in Gravetter et al., *Essentials of Statistics for the Behavioral Sciences*, 10e.]

???

Every score sits some distance from the overall mean. Part of that distance is its group's distance from the overall mean. The rest is its distance from its own group's mean. Three numbers to find: SS, df and MS. SS and df add up across the split. MS doesn't.

---

---

# A mean square is a variance

&lt;div class="math-display"&gt;\[
MS_{\text{between}} = SS_{\text{between}} \,/\, df_{\text{between}} = 110.52 \,/\, 2 = 55.26
\]&lt;/div&gt;

&lt;div class="math-display"&gt;\[
MS_{\text{within}} = SS_{\text{within}} \,/\, df_{\text{within}} = 9309.39 \,/\, 616 = 15.11
\]&lt;/div&gt;

&lt;div class="math-display"&gt;\[
F = MS_{\text{between}} \,/\, MS_{\text{within}} = 55.26 \,/\, 15.11 = 3.66
\]&lt;/div&gt;

# Steps 1 and 2: set up the test

.box-3.small.sp-after-half[At baseline, do math scores differ across the three centers?]

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; Step &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; In words &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; In symbols &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 1. State H₀ &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; The three population means are the same &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; μ&lt;sub&gt;Chhatarpur&lt;/sub&gt; = μ&lt;sub&gt;Govindpuri&lt;/sub&gt; = μ&lt;sub&gt;Tekhand&lt;/sub&gt; &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 2. Set the criteria &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; α = 0.05, and two df &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; df = 2 and 616 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt;  &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Reject H₀ if F is beyond the cutoff &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; F(2, 616) beyond 3.01 &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-inv-3.small[There's one cutoff. Differences in any direction make F bigger, so H₁ needs no direction]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

The F table has df between across the top and df within down the side. If the exact df isn't in the table, use the next lower one. Each pair of dfs has its own curve, just as each df had its own t curve.

Don't call an F-test two-tailed. H₁ is non-directional, but we only look in the upper tail.

---

# Steps 3 and 4: F passes the cutoff

&lt;img src="10-anova_files/figure-html/decision-plot-1.png" alt="An F curve with 2 and 616 degrees of freedom. It starts high at 0 and falls toward a long right tail. The tail beyond the cutoff of 3.01 is shaded. A vertical line marks our F of 3.66, a little past the cutoff." width="90%" style="display: block; margin: auto;" /&gt;

.box-3.small[3.66 is beyond 3.01, so we reject H₀. p = 0.026]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

If the three population means were the same, an F this large would turn up about 2.6% of the time. So at least one center differs.

F can't go below zero, so there's no lower tail to worry about.

---

# How big? About 1.2% of the total

&lt;div class="math-display"&gt;\[
\hat{\eta}^2 = \frac{SS_{\text{between}}}{SS_{\text{total}}} = \frac{110.5}{9419.9} = 0.012
\]&lt;/div&gt;

.box-inv-3.small.sp-after-half[At baseline, math scores differed across the three centers, F(2, 616) = 3.66, p = 0.026, η̂² = 0.012]

.box-3.small[Real, but small. And no lottery made these groups, so it's a difference, not an effect]

.book-tag[In the book: η² (eta squared), with no hat. Regression calls this share r²]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Topic 8's notes promised this. η̂² is the share of the total variability that sits between the groups. With 619 students, a small difference can reach significance, as Topic 7 warned.

Greek means population, so this deck adds a hat to the book's η². The sample value is an estimate.

---

# With two groups, F is just t²

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; Mindspark and control at endline &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Topic 9: t-test &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Today: ANOVA &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Test statistic &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; t(537) = 5.371 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; F(1, 537) = 28.85 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Cutoff &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; ±1.964 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 3.859 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; p &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; Below 0.001 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; Below 0.001 &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-inv-3.small.sp-after-half[5.371² = 28.85, and 1.964² = 3.859. Same test, same decision]

.box-3.small[Squaring folds t's two tails into F's one. ANOVA is the t-test, opened up to more groups]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

This is the blueprint's point. t compares a gap with its standard error. F compares a squared gap, stretched to any number of groups, with a variance. Topic 14 shows that regression gives this same number too.

---

# F doesn't say which group differs

.box-inv-3.small.sp-after-half[With three or more groups, a significant F doesn't name the group]

.pull-left[
.box-inv-3.small[One center against the other two?]
]

.pull-right[
.box-inv-3.small[All three apart?]
]

.box-3.small.sp-after-half[So after a significant F, we compare pairs. These are called post hoc tests]

.box-inv-3.small[That's our t-tests again, so the false alarms are back. Post hoc tests set a stricter α]

???

Post hoc means "after this". They come after a significant F. If F isn't significant, we stop there.

There are many such tests. The book covers Tukey's and Scheffé's. We use Bonferroni's, because it's simple, and it shows the logic.

---

# Bonferroni: split α across tests

&lt;div class="math-display"&gt;\[
\alpha_{\text{adjusted}} = \frac{\alpha}{\text{tests}} = \frac{0.05}{3} = 0.0167
\]&lt;/div&gt;

.pull-left[
.box-inv-3.small[Test each pair at 0.0167, not 0.05]
]

.pull-right[
.box-inv-3.small[Overall: 1 − (1 − 0.0167)³ = 0.049]
]

.box-3.small[That's just under 0.05, as we wanted. Bonferroni plays it a little safe]

???

The 0.049 assumes independent tests, and these three aren't. Bonferroni keeps the overall rate at or under 0.05 either way.

Compare with 0.14 for three tests at 0.05.

Keep four decimals here. With 0.017 you'd get 0.0501, a shade over 0.05, but that's only rounding. The exact 0.05 / 3 gives 0.049.

A slightly less cautious correction, Šidák's, hits 0.05 exactly. It isn't needed in this course.

A close call: 2.43 against 2.40. Tukey's test is the other common choice, and software runs it. Its p already carries its adjustment, so it's compared with 0.05. The p of 0.015 is just under 0.0167. Maintaining H₀ for the other pairs doesn't show they're equal. Govindpuri has only 82 students.

Post hoc tests can disagree on a close call. The 2024 deck used Scheffé's test on this pair, and it maintained H₀, with F = 2.95 against 3.01. Scheffé's is more cautious than Bonferroni's or Tukey's.
