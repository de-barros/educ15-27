<!-- MathJax measures fonts through remark's scaling, so in a small window or an
     embedded frame it shrinks math to half size. Fix the size instead. -->
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({ CommonHTML: { scale: 118, matchFontHeight: false } });
</script>

<!-- A lazy frame can stay blank when a deck reloads on its slide, so load the
     simulator on the slide that's showing. -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    function loadSimulators() {
      document.querySelectorAll(".remark-slides-area .remark-visible .sim-live").forEach(function (frame) {
        frame.loading = "eager";
      });
    }
    slideshow.on("afterShowSlide", loadSimulators);
    loadSimulators();
  });
</script>
