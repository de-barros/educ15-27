.source[Data: Muralidharan, Singh, and Ganimian (2019).]

---

# A polygon swaps bars for dots and lines

&lt;img src="02-displaying-data_files/figure-html/polygon-grouped-1.png" alt="The same histogram in pale blue, with a dark line on top. Each dot sits at the middle of an interval at the height of its bar, and the line drops to zero at both ends. The line rises to a peak at the interval from 10 to 14 and then falls." width="84%" style="display: block; margin: auto;" /&gt;

.box-inv-3.small[Each dot sits at the middle of its interval. A line is easier to overlay than bars]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

The line drops to zero one interval past each end, so the shape closes on the axis.

---

# Every score: more detail, more bumps

&lt;img src="02-displaying-data_files/figure-html/polygon-full-1.png" alt="A polygon with one dot for every score from 0 to 26. It rises to a jagged peak of 76 students at a score of 12, with a sharp dip right after it, and then falls to almost nothing above 20." width="84%" style="display: block; margin: auto;" /&gt;

.box-inv-3.small[With no grouping we keep every count, and the picture gets jagged]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

---

# Percentages put groups on one scale

&lt;img src="02-displaying-data_files/figure-html/percentages-1.png" alt="Two polygons of baseline math scores for 470 girls and 149 boys. In the left panel, which shows counts, the line for girls towers over the line for boys. In the right panel, which shows the percent of each group, the two lines have nearly the same height and shape." width="90%" style="display: block; margin: auto;" /&gt;

.box-inv-3.small[% = 100 × f / n. On the left, size hides the shape. On the right, we can compare]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

The shapes are the point. Girls and boys look much alike once we use percentages. There are simply about 3 times as many girls in this sample.

---

# A density plot smooths out the bumps

&lt;img src="02-displaying-data_files/figure-html/density-1.png" alt="The percentage of students at each math score, shown as pale bars, with a smooth dark curve running through them. The curve has one peak near 12 and falls away evenly on both sides." width="80%" style="display: block; margin: auto;" /&gt;

.box-inv-3.small[It adds up a small bump at each score. You'll read these, not compute them]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

The name is fancy, the idea isn't. Smooth curves are how we'll draw distributions for the rest of the quarter, starting with the normal curve.

---

# Categories get bars with gaps

&lt;img src="02-displaying-data_files/figure-html/bar-graph-1.png" alt="Bar graph of students at the three Mindspark centers, with gaps between the bars: Chhatarpur has 161, Govindpuri has 82, Tekhand has 376." width="80%" style="display: block; margin: auto;" /&gt;

.box-inv-3.small[Scores have an order and even steps, so a histogram's bars touch. Centers are just names, so these bars stand apart]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

This is Tuesday's scales of measurement at work. Nominal and ordinal variables get a bar graph. Interval and ratio variables get a histogram or polygon.

---

# Symmetric, unimodal and normal differ

&lt;img src="02-displaying-data_files/figure-html/shapes-1.png" alt="Three curves side by side. The first has two equal peaks and mirrors around its center, so it's symmetric but not unimodal. The second has one peak on the left and a long tail to the right, so it's unimodal but not symmetric. The third is a bell curve: symmetric, unimodal and normal." width="92%" style="display: block; margin: auto;" /&gt;

.pull-left-3[
.box-inv-3.small[Symmetric: each side mirrors the other]
]

.pull-middle-3[
.box-inv-3.small[Unimodal: one high point]
]

.pull-right-3[
.box-inv-3.small[Normal: a bell, common in nature]
]

???

A normal distribution is symmetric and unimodal, with the most scores in the middle. Not every symmetric, unimodal shape is normal, but that's a detail for later.

Our math scores are unimodal and close to symmetric. Many measurements in nature look like this, which is why the bell curve keeps coming back.

---

# Skewed distributions have one long tail

&lt;img src="02-displaying-data_files/figure-html/skew-1.png" alt="Two curves. On the left, a peak near the high end with a long tail stretching to the left, labeled skewed left. On the right, a peak near the low end with a long tail stretching to the right, labeled skewed right." width="90%" style="display: block; margin: auto;" /&gt;

.pull-left[
.box-inv-3.small[A very easy test: scores pile up high, and a few trail off to the left]
]

.pull-right[
.box-inv-3.small[A very hard test: scores pile up low, and a few trail off to the right]
]

.book-tag[In the book: skewed left is negatively skewed, and skewed right is positively skewed]

???

Skew is named after the tail, not the peak. That's the common mistake. Tuesday we'll see what a long tail does to the mean.

---

class: title title-8

# Predict it: The endline scores

.box-inv-8.small.sp-after-half[The same study, about 4.5 months later. Picture the baseline curve you just saw. What does the endline curve look like?]

.options[
.option[
**A** In about the same place
]
.option[
**B** Moved right, still one peak
]
.option[
**C** Moved right, now two peaks
]
.option[
**D** Moved left
]
]

.box-8.small[Tell a neighbor why. Half these students had Mindspark, and half didn't]

???

About 6 minutes. Hands are fine here. Ask a few students to defend their answer before the next slide, especially anyone who picked C. If half got a program and half didn't, why wouldn't we see two peaks?

---

class: title title-8

# Predict it: The whole pile moved right

&lt;img src="02-displaying-data_files/figure-html/endline-1.png" alt="Two smooth curves of math scores, on a percent scale. The baseline curve, for 619 students, peaks near 12. The endline curve, for 539 students, sits about 6 points to the right. It's wider and lower, with one broad peak." width="82%" style="display: block; margin: auto;" /&gt;

.box-inv-8.small[So, B: one wide peak. Half the students scored at least 11 at baseline, and half at least 17 at endline]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Percentages again, because the two rounds have different numbers of students.

Why not two peaks, with one group ahead? At endline the treatment group's mean is about 2.7 points higher, but scores spread much wider than that, so the two piles overlap into one.

Why did the pile move? Everyone had 4.5 more months of school, and half also had Mindspark. A plot of everyone can't separate those two. That's what the rest of the course is for: this is description, and explanation comes later.

The endline tests aren't identical to the baseline test. They were out of 34 or 35, depending on the grade band. So treat this as a rough picture.
