layout: false
class: center middle section-title section-title-1 animated fadeIn

# A line for prediction

---

layout: true
class: title title-1

---

# A line sums up the cloud

&lt;img src="12-regression-line_files/figure-html/line-plot-1.png" alt="Scatter plot of 539 Mindspark students, with baseline math score on the horizontal axis and endline math score on the vertical axis. A straight line rises through the wide cloud of dots, from about 9 at a baseline of 0 to about 29 at a baseline of 26." width="82%" style="display: block; margin: auto;" /&gt;

.box-inv-1.small[The line shows the pattern, describes it in two numbers, and lets us predict]

.source[Data: Muralidharan, Singh, and Ganimian (2019). 539 students. Dots are nudged so equal scores don't hide each other.]

???

Same dots as Topic 11. Topic 11's simulator already drew a line through a cloud, and now we ask what that line is.

Regression finds the straight line that best fits a set of dots. By the end of block 2, "best" will mean something exact.

---

# A line needs two numbers

&lt;div class="math-display"&gt;\[
\hat{Y} = a + bX
\]&lt;/div&gt;

.pull-left-3[
.box-inv-1.small[Ŷ]

.center[The predicted Y. The hat says it's an estimate]
]

.pull-middle-3[
.box-inv-1.small[a, the intercept]

.center[The value of Ŷ when X = 0]
]

.pull-right-3[
.box-inv-1.small[b, the slope]

.center[How much Ŷ changes when X goes up by 1]
]

.box-1.small[Greek means population: β is the slope for everyone, and b is our estimate of it]

.book-tag[In the book: Ŷ = bX + a. It's the same line, in a different order]

???

The rule from Topic 3 still holds. A Latin letter or a hat means an estimate, so never call b "beta".

Topic 7 used β for the chance of a Type 2 error. That's a different β, and the context tells them apart. The population line gets plain numbers, such as Y = 2.00 + 0.50 X in the simulator, because α is taken too.

---

# Our line, read in points

.pull-left[
&lt;img src="12-regression-line_files/figure-html/anatomy-plot-1.png" alt="The same line, with the dots faded. A red dot marks where the line meets a baseline of 0, at 8.87. A gold step shows that moving 10 points to the right, from a baseline of 10 to 20, raises the line by 7.6 points." width="100%" style="display: block; margin: auto;" /&gt;
]

.pull-right[
.box-1.small[Ŷ = 8.87 + 0.76X]

.box-inv-1.small.sp-after-half[**a = 8.87:** a student with 0 at baseline is predicted to score 8.87 at endline]

.box-inv-1.small.sp-after-half[**b = 0.76:** one more point at baseline goes with 0.76 more points at endline, on average]

.box-1.small[Say "goes with", not "causes"]
]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Both numbers are in points. b compares students: among students who are one point apart at baseline, the one ahead tends to be 0.76 points ahead at endline. It doesn't say what would happen to one student who gained a point. We're still in the prediction column.

The numbers on this slide match 2024: 8.87 and 0.76.

---

# It predicts an average, not a student

&lt;img src="12-regression-line_files/figure-html/tens-plot-1.png" alt="The scatter plot again, with the 59 students who scored 10 at baseline in dark blue. Their endline scores run from 7 to 32. A red diamond on the line marks the prediction, 16.47, in the middle of them." width="76%" style="display: block; margin: auto;" /&gt;

.box-1.small[8.87 + 0.76 × 10 = **16.47**. Yet these 59 students ended anywhere from 7 to 32]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

The arithmetic uses the rounded line, the way students will do it. Software keeps more decimals and gets 16.51.

The prediction is our best guess, and it's close to what these students did on average. Any one student can land far from it, and block 2 is about exactly that gap.

---

]

]

---

layout: false
class: center middle section-title section-title-6 animated fadeIn

# What the line minimizes

---

layout: true
class: title title-6

---

# A residual is how far the line missed

.pull-left[
&lt;img src="12-regression-line_files/figure-html/residual-plot-1.png" alt="The scatter plot with faded dots and the line. One student at a baseline of 13 and an endline of 30 sits above the line, joined to it by a vertical red segment. Another at a baseline of 15 and an endline of 12 sits below the line, joined to it the same way." width="100%" style="display: block; margin: auto;" /&gt;
]

.pull-right[
.box-6.small.sp-after-half[Residual = Y − Ŷ, what happened minus what we predicted]

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:center;"&gt; X &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Y &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Ŷ &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Y − Ŷ &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:center;"&gt; 13 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 30 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 18.75 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; +11.25 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:center;"&gt; 15 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 12 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 20.27 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; −8.27 &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-inv-6.small[Above the line, it's positive. Below the line, it's negative]
]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

These are two real students. The first did 11.25 points better than their baseline predicts. The second did 8.27 points worse.

The residual is what the line can't explain. It might be a good day, a strong teacher or a lucky guess, and the data don't say which.

---

# Residuals add to 0, so we square them

&lt;img src="12-regression-line_files/figure-html/residual-hist-1.png" alt="Histogram of the residuals for all 539 students. It's centered on 0 and roughly symmetric, with most residuals between minus 10 and plus 10, and a vertical line at 0." width="74%" style="display: block; margin: auto;" /&gt;

.box-inv-6.small.sp-after-half[All 539 residuals add up to 0, like deviations from a mean]

.box-6.small[So we square them, as in Topic 3: Σ(Y − Ŷ)² = 14,314, the SS&lt;sub&gt;residual&lt;/sub&gt;]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Deviations from the mean add up to zero, and that's why variance squares them. The same thing happens here, for the same reason. In fact, the mean is the one number that minimizes squared deviations, and the regression line does the same job for a whole line of numbers.

---

# Loose dots leave big squares

&lt;div class="sim-slide" style="height: 495px;"&gt;
&lt;iframe class="sim-live" src="../simulator/index.html?ui=slide&amp;tab=correlation&amp;n=12&amp;r=0.3&amp;seed=2027&amp;resid=1&amp;squares=1" title="Simulator's correlation view with 12 draggable points in a loose cloud and a regression line. A vertical residual joins each point to the line, and a pink square shows each squared residual. Many squares are large. The readout shows r of 0.30 and a sum of squared residuals of about 2,252." loading="lazy"&gt;&lt;/iframe&gt;
&lt;img class="sim-static" src="img/sim/26428cf84b17.png" alt="Simulator's correlation view with 12 draggable points in a loose cloud and a regression line. A vertical residual joins each point to the line, and a pink square shows each squared residual. Many squares are large. The readout shows r of 0.30 and a sum of squared residuals of about 2,252."&gt;
&lt;/div&gt;

.source[Simulator after Kristoffer Magnusson, rpsychologist.com. On your phone: [the simulator page](https://educ15.de-barros.com/resource/simulator-correlation.html).]

???

**Point to the readout:** r is 0.30, and the sum of squared residuals is 2,252. Each pink square is one student's squared miss.

**Drag a point with a big square toward the line.** Its square shrinks, and the total falls. Then drag it away and watch the square grow, and the line chase it. A vertical line is a residual, and the springs picture from 2024 fits here: each dot pulls on the line, and far dots pull hardest.

The tool always shows the best line for the dots, so students can't move the line itself. The next slide and the plot after it do that job.

Students can't drag on this screen. Those with a phone or laptop can open the simulator's Correlation and regression page on the course site, where Residuals and Squared residuals are checkboxes.

---

# Tight dots leave small squares

&lt;div class="sim-slide" style="height: 495px;"&gt;
&lt;iframe class="sim-live" src="../simulator/index.html?ui=slide&amp;tab=correlation&amp;n=12&amp;r=0.9&amp;seed=2027&amp;resid=1&amp;squares=1" title="The same simulator view with 12 points, now close to the line. The residuals are short and the pink squares are small. The readout shows r of 0.90 and a sum of squared residuals of about 470." loading="lazy"&gt;&lt;/iframe&gt;
&lt;img class="sim-static" src="img/sim/b9d8bc4802df.png" alt="The same simulator view with 12 points, now close to the line. The residuals are short and the pink squares are small. The readout shows r of 0.90 and a sum of squared residuals of about 470."&gt;
&lt;/div&gt;

.source[Simulator after Kristoffer Magnusson, rpsychologist.com.]

???

Same 12 baseline scores, with r up from 0.30 to 0.90. Flip back and forth between the two slides. The total falls from 2,252 to 470.

So the squares are a way to see fit. Small squares mean the line fits well, and r is high. That's where r² comes from, later today.

---

# Least squares picks the smallest total

&lt;img src="12-regression-line_files/figure-html/three-lines-1.png" alt="Three copies of the same scatter plot of eight students, each with a different line and red squares showing each squared residual. A flat line has large squares and a total of 180.0. A line that is too steep has a total of 132.0. The least squares line has the smallest squares and a total of 58.5." width="86%" style="display: block; margin: auto;" /&gt;

.box-6.small[Regression chooses the a and b that make Σ(Y − Ŷ)² as small as it can be]

.source[Data: Muralidharan, Singh, and Ganimian (2019). Students 25 to 32 from Topic 11.]

???

Back to our 8 students, where each square is big enough to see. Two of them share a point, so one square is darker. All three lines go through the two means.

The name is ordinary least squares, or OLS. It's the same regression. No other straight line through these 8 students gets below 58.5.

---

# Think of the line as held by springs

&lt;img src="12-regression-line_files/figure-html/springs-1.png" alt="Scatter plot of eight students with the least squares line. A vertical spring joins each dot to the line. Dots far from the line have long springs, and dots near it have short ones." width="70%" style="display: block; margin: auto;" /&gt;

.box-6.small[Every student's spring pulls on the line. Least squares is where they balance]

.source[Data: Muralidharan, Singh, and Ganimian (2019). Students 25 to 32 from Topic 11.]

???

Vertical springs, one per student. A spring stores energy with the square of its stretch, so the resting place of the line is the one with the smallest total of squared residuals.

---

# The best slope sits at the bottom

&lt;img src="12-regression-line_files/figure-html/bowl-plot-1.png" alt="A U-shaped curve of the total of squared residuals against the slope of the line. The total is 180.0 at a slope of 0, falls to a minimum of 58.5 at a slope of 2.25, and rises to 132.0 at a slope of 4." width="80%" style="display: block; margin: auto;" /&gt;

.box-inv-6.small[Every slope has a total. b = 2.25 is the only one at the bottom of the curve]

.source[Data: Muralidharan, Singh, and Ganimian (2019). Students 25 to 32. Each line goes through the two means.]

???

This is what "the squares shrink as the line fits" looks like. Walk along the curve from the left: the line gets steeper, the total falls, it bottoms out at 58.5, and then it rises again. Tilt the line past the best slope, and the squares grow back.

A computer doesn't try slopes one at a time. There's a formula for the bottom of the curve, which we use in block 3.

---

# We measure misses up and down

&lt;img src="12-regression-line_files/figure-html/vertical-plot-1.png" alt="Two copies of the plot of eight students and their line. On the left, labeled this, each dot is joined to the line by a vertical segment. On the right, labeled not this, each dot is joined to the line by a segment at a right angle to the line." width="66%" style="display: block; margin: auto;" /&gt;

.box-inv-6.small[We're predicting Y, so a miss is a distance in Y]

.source[Data: Muralidharan, Singh, and Ganimian (2019). Students 25 to 32.]

???

The right-hand picture looks natural, and it's a common wrong guess.

This is why it matters which score is X and which is Y. Swap them, and the misses run sideways instead, so you get a different line. With our students, predicting baseline from endline has a slope of 0.33, not 1 / 0.76. r is the same in both directions, but regression isn't.

---

---

layout: false
class: center middle section-title section-title-3 animated fadeIn

# Finding a and b

---

layout: true
class: title title-3

---

# We already have what we need

.box-inv-3.small[From Topic 11, our 8 students: SP = 54, SS&lt;sub&gt;X&lt;/sub&gt; = 24, M&lt;sub&gt;X&lt;/sub&gt; = 10.5, M&lt;sub&gt;Y&lt;/sub&gt; = 22.5]

&lt;div class="math-display"&gt;\[
b = \frac{SP}{SS_X} = \frac{54}{24} = 2.25
\]&lt;/div&gt;

&lt;div class="math-display"&gt;\[
a = M_Y - b M_X = 22.5 - 2.25 \times 10.5 = −1.125
\]&lt;/div&gt;

.box-inv-3.small[SP: how X and Y move together. SS&lt;sub&gt;X&lt;/sub&gt;: how X moves alone]

.box-3.small[Their line: Ŷ = −1.125 + 2.25X]

.source[Data: Muralidharan, Singh, and Ganimian (2019). Students 25 to 32.]

???

These formulas give the bottom of the curve we just saw. Students need to use them, not derive them.

The 2024 slides wrote "beta = 2.25" here. It's an estimate, so it's b.

In Lab 9, a spreadsheet's `SLOPE` and `INTERCEPT` do this for all 539 students.

---

# The line runs through the two means

&lt;img src="12-regression-line_files/figure-html/means-plot-1.png" alt="The eight students with their line. Dashed lines mark the mean baseline of 10.5 and the mean endline of 22.5. The regression line passes exactly through the point where the dashed lines cross, shown as a red diamond." width="80%" style="display: block; margin: auto;" /&gt;

.box-inv-3.small[A student at M&lt;sub&gt;X&lt;/sub&gt; is predicted to land at M&lt;sub&gt;Y&lt;/sub&gt;. That's where a's formula comes from]

.source[Data: Muralidharan, Singh, and Ganimian (2019). Students 25 to 32.]

???

This matches the line from 2024, so students now know where it came from. The same is true for all 539 students: 8.87 + 0.76 × 11.06 is about 17.32, the mean of Y.

---

# Don't trust the line past the data

&lt;img src="12-regression-line_files/figure-html/extrapolate-plot-1.png" alt="The eight students, whose baseline scores run from 8 to 13, inside a shaded band. Their line is solid inside the band and dashed outside it. The dashed part reaches a baseline of 0 at a predicted score of −1.125, which is below zero and marked with a red dot." width="80%" style="display: block; margin: auto;" /&gt;

.box-inv-3.small[A score below 0 is impossible. Predict only inside the scores you saw]

.source[Data: Muralidharan, Singh, and Ganimian (2019). Students 25 to 32.]

???

A prediction is only worth trusting inside the range of X we observed. These 8 students run from 8 to 13, so the line says nothing about a score of 0.

With all 539 students, a = 8.87 is safer, but it still leans on few students: only 2 scored 0 at baseline.

---

# b is r, rescaled into points

&lt;div class="math-display"&gt;\[
b = r \times \frac{\hat{\sigma}_Y}{\hat{\sigma}_X}
\]&lt;/div&gt;

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; Students &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; r &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; σ̂&lt;sub&gt;Y&lt;/sub&gt; &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; σ̂&lt;sub&gt;X&lt;/sub&gt; &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; r × σ̂&lt;sub&gt;Y&lt;/sub&gt; / σ̂&lt;sub&gt;X&lt;/sub&gt; &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; All 539 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 0.502 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 5.97 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 3.92 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; &lt;strong&gt;0.76&lt;/strong&gt; &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Our 8 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 0.822 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 5.07 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 1.85 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; &lt;strong&gt;2.25&lt;/strong&gt; &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-3.small[r has no units. b is in points of Y per point of X. They always share a sign]

.book-tag[In the book: σ̂&lt;sub&gt;Y&lt;/sub&gt; and σ̂&lt;sub&gt;X&lt;/sub&gt; are written s&lt;sub&gt;Y&lt;/sub&gt; and s&lt;sub&gt;X&lt;/sub&gt;]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

So a slope isn't a new idea. It's the correlation, stretched by how spread out Y is compared with X. If r is 0, b is 0. That's why a test of r and a test of b will agree on Thursday.

The two groups show why b alone can't tell you how strong a relationship is. Our 8 students have b = 2.25 partly because their baseline scores are so close together.

---

# Regression to the mean is in the slope

.pull-left[
&lt;img src="12-regression-line_files/figure-html/rtm-plot-1.png" alt="Scatter plot of all students in standard deviation units, with faded dots. A dashed line has a slope of 1. The solid regression line has a slope of 0.50, flatter than the dashed line. At 2 SDs on baseline, the dashed line is at 2 and the regression line is at about 1." width="100%" style="display: block; margin: auto;" /&gt;
]

.pull-right[
.box-3.small.sp-after-half[In SDs, the slope is r, and r is below 1 unless the dots fall on a perfect line]

.box-inv-3.small.sp-after-half[So a student 2 SDs above the mean is predicted only 1.0 SD above it]

.box-inv-3.small[The 42 students with 17 or more at baseline were 1.96 SDs above the mean. At endline: 0.98]
]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

This is the smaller gap from the first try-it. Part of any high score is a good day, and good days don't repeat. So high scorers tend to land closer to the mean the second time, and low scorers do too. No program is needed. That's where the word "regression" comes from: Galton saw it in the heights of parents and children.

It's why you can't judge a program by looking only at the lowest scorers and how far they rise.

The rule is about SDs, not points. Our b of 0.76 happens to be below 1, but the 8 students' b of 2.25 isn't, because their X barely spreads. In SDs, their slope is 0.82.

---

# r² is how much the squares shrink

&lt;img src="12-regression-line_files/figure-html/r2-plot-1.png" alt="Two stacked bars, each showing the total SS of Y split in two. For our 8 students, 180.0 splits into 121.5 predicted from X and 58.5 left in the residuals. For all 539 students, 19,143 splits into 4,829 and 14,314." width="88%" style="display: block; margin: auto;" /&gt;

&lt;div class="math-display"&gt;\[
r^2 = \frac{SS_Y - SS_{residual}}{SS_Y} = \frac{180 - 58.5}{180} = 0.675
\]&lt;/div&gt;

.box-inv-3.small[A flat line ignores X, and its squares total SS&lt;sub&gt;Y&lt;/sub&gt;. For our 8, the best line cuts that by 67.5%]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

This keeps Topic 11's promise. The flat line predicts M&lt;sub&gt;Y&lt;/sub&gt; for everyone, so its squares are SS&lt;sub&gt;Y&lt;/sub&gt;: that's the "Flat" total on the curve. The regression line's squares are SS&lt;sub&gt;residual&lt;/sub&gt;. r² is the share of the squares that goes away when we use X.

With all 539 students, (19,143 − 14,314) / 19,143 = 0.252, the same 0.252 as Topic 11.

The bars redraw the book's split of SS&lt;sub&gt;Y&lt;/sub&gt; into SS&lt;sub&gt;regression&lt;/sub&gt; and SS&lt;sub&gt;residual&lt;/sub&gt;, with our numbers. Thursday uses this split.
