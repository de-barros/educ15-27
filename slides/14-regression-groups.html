# A center is a name, not a number

.box-inv-1.small[Regression needs numbers, so we turn each center into yes/no columns]

&lt;table class="deck-table tight"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; A student in &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Govindpuri? &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Tekhand? &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Chhatarpur &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 0 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 0 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Govindpuri &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 1 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 0 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Tekhand &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 0 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 1 &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

&lt;div class="math-display"&gt;\[
\hat{Y} = a + b_1 \times \text{Govindpuri} + b_2 \times \text{Tekhand}
\]&lt;/div&gt;

.box-1.small[Three groups need two columns: k − 1, which is ANOVA's df between]

.book-tag[The book stops at one predictor. The handout on this topic's page covers two or more]

???

Thursday ended with "regression plays the part of between, and residual plays the part of within." So can a line do ANOVA's whole job? The one thing in the way is that a center is a name.

Why not a third column for Chhatarpur? It would add nothing: a student with 0 and 0 must be in Chhatarpur. That group with all zeros is the reference group. The word for such a column is a dummy variable, or an indicator.

Each b now has its own column, so each gets a number. b₁ and b₂ are still estimates, of β₁ and β₂.

---

# Each row is a mean or a gap

&lt;div class="r-output"&gt;&lt;div&gt;lm(formula = baseline&amp;#95;math ~ center, data = students)       &lt;/div&gt;&lt;div&gt;                 Estimate Std. Error t value Pr(&amp;gt;|t|)       &lt;/div&gt;&lt;div&gt;(Intercept)      11.67081    0.30638  38.093   &amp;lt;2e&amp;#45;16 &amp;#42;&amp;#42;&amp;#42;   &lt;span class="r-note"&gt;← a: Chhatarpur's mean&lt;/span&gt;&lt;/div&gt;&lt;div&gt;centerGovindpuri &amp;#45;0.07325    0.52742  &amp;#45;0.139   0.8896       &lt;span class="r-note"&gt;← Govindpuri − Chhatarpur&lt;/span&gt;&lt;/div&gt;&lt;div&gt;centerTekhand    &amp;#45;0.88889    0.36614  &amp;#45;2.428   0.0155 &amp;#42;     &lt;span class="r-note"&gt;← Tekhand − Chhatarpur&lt;/span&gt;&lt;/div&gt;&lt;div&gt;Residual standard error: 3.887 on 616 degrees of freedom    &lt;span class="r-note"&gt;← √MS&lt;sub&gt;within&lt;/sub&gt;&lt;/span&gt;&lt;/div&gt;&lt;div&gt;Multiple R&amp;#45;squared:  0.01173, Adjusted R&amp;#45;squared:  0.008524 &lt;/div&gt;&lt;div&gt;F&amp;#45;statistic: 3.657 on 2 and 616 DF,  p&amp;#45;value: 0.02638       &lt;span class="r-note"&gt;← Topic 10's F&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

.box-1.small.sp-after-half[Start at a and add each gap: 11.67 − 0.07 = 11.60, and 11.67 − 0.89 = 10.78]

.box-inv-1.small[Those are Topic 10's three means. With yes/no columns, every row is about groups]

.source[Data: Muralidharan, Singh, and Ganimian (2019). All 619 students at baseline. Output from R, `summary(lm())`.]

???

The last row's t, −2.43, is Topic 10's try-it: Chhatarpur against Tekhand, with the same gap, the same MS within and the same df. Its p of 0.015 is the same too, and it needs the same Bonferroni care.

To compare Govindpuri with Tekhand, change which center is the reference. Nothing else about the model changes.

Each row has a t, and the F at the bottom tests all the b's together. That's the point Thursday's notes made: with more than one predictor, F and t are no longer the same number.

---

.box-inv-1.small.sp-after-half[Same numbers, to the last decimal: F(2, 616) = 3.66, p = 0.026]

.box-inv-1.small.sp-after-half[Topic 10's η̂² = 0.012 is R's Multiple R-squared]

.box-1.small[A one-way ANOVA is a regression on yes/no columns]

.book-tag[With more than one predictor, r² is written R²]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Nothing here is rounded or approximate. The group means are Ŷ, so SS residual is every student's distance from their own center's mean, and that's SS within.

ANOVA and regression grew up in different fields, so they use different words. It's one model.

# With two groups, one column will do

&lt;img src="14-regression-groups_files/figure-html/treat-plot-1.png" alt="Dots for 539 students' endline math scores in two columns, at X = 0 for control and X = 1 for Mindspark. A red diamond marks each group's mean: 15.99 and 18.68. A straight line joins the two diamonds, and its slope is 2.69." width="80%" style="display: block; margin: auto;" /&gt;

.box-1.small[X can only be 0 or 1, so the line joins two means. Its slope is the gap]

.source[Data: Muralidharan, Singh, and Ganimian (2019). 539 students. Dots are nudged so equal scores don't hide each other.]

???

Same picture as Topic 12, with only two places for X to be. The least squares line must go through both group means, since each mean is what minimizes squares within its own column.

So a is the control group's mean and b is the gap. Nothing else is possible.

---

# The slope is Topic 9's gap

&lt;div class="r-output"&gt;&lt;div&gt;lm(formula = endline&amp;#95;math ~ treat, data = mindspark)            &lt;/div&gt;&lt;div&gt;            Estimate Std. Error t value Pr(&amp;gt;|t|)                &lt;/div&gt;&lt;div&gt;(Intercept)  15.9927     0.3520  45.430  &amp;lt; 2e&amp;#45;16 &amp;#42;&amp;#42;&amp;#42;            &lt;span class="r-note"&gt;← a: the control mean&lt;/span&gt;&lt;/div&gt;&lt;div&gt;treat         2.6915     0.5011   5.371 1.17e&amp;#45;07 &amp;#42;&amp;#42;&amp;#42;            &lt;span class="r-note"&gt;← b: the gap, and its σ̂&lt;/span&gt;&lt;/div&gt;&lt;div&gt;Residual standard error: 5.816 on 537 degrees of freedom        &lt;span class="r-note"&gt;← √pooled variance&lt;/span&gt;&lt;/div&gt;&lt;div&gt;Multiple R&amp;#45;squared:  0.05098, Adjusted R&amp;#45;squared:  0.04922      &lt;span class="r-note"&gt;← r²&lt;/span&gt;&lt;/div&gt;&lt;div&gt;F&amp;#45;statistic: 28.85 on 1 and 537 DF,  p&amp;#45;value: 1.167e&amp;#45;07         &lt;span class="r-note"&gt;← F = t²&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

.pull-left[
.box-inv-1.small[Ŷ = 15.99 + 2.69X. At X = 0, Ŷ = 15.99]
]

.pull-right[
.box-inv-1.small[At X = 1, Ŷ = 15.99 + 2.69 = 18.68]
]

.box-1.small[The Std. Error, 0.501, is Topic 9's σ̂&lt;sub&gt;M₁−M₂&lt;/sub&gt;. The t, 5.37, is Topic 9's t]

.source[Data: Muralidharan, Singh, and Ganimian (2019). Output from R, `summary(lm())`.]

???

15.99 and 18.68 are the two numbers from the first week of class. In Topic 1 we asked if that gap was real or just luck.

Sign: Topic 9 subtracted control from Mindspark, so its t was positive too. If R ran `t.test()`, it would subtract the other way, and print −5.37. Only the sign changes.

This t is the pooled t, because regression assumes one spread around the line. That's the same assumption.

???

This is the slide to linger on. Students learned these as four tests, and each has its own formula. All of them ask: how much better do we predict Y when we know which group someone is in?

Each still earns its place: the t-test is the simple hand calculation, ANOVA handles many groups at once, r gives a scale-free size, and regression lets us add more predictors, which is the rest of today.

# Parallel lines mean no interaction

&lt;img src="14-regression-groups_files/figure-html/parallel-plot-1.png" alt="Two line charts of price against cheese, with one line for no chili and one for chili. In the left panel, both lines rise by the same amount, so they are parallel: $2.00 to $2.35, and $2.35 to $2.70. In the right panel, a made-up discount sets chili cheese at $2.50, so the chili line rises less and the two lines come together." width="90%" style="display: block; margin: auto;" /&gt;

.box-6.small[On the right, what chili adds depends on whether you have cheese]

.source[The right-hand price of $2.50 is made up.]

???

The left panel is the real menu. Parallel lines mean that the gap between them stays the same all the way across.

The right panel is a made-up combo discount. Now the sum of the parts is $2.70, and the combination costs $2.50, so the interaction is −$0.20. It can go either way: extra or muted.

Lines don't need to cross for there to be an interaction. They only need to not be parallel.

This is the idea of a two-factor design, and it's still just columns. Regression doesn't need a new method for two factors.

.box-inv-6.small.sp-after-half[We can't say the effect differs by gender. We can't say it's the same either: the 95% interval for β₃ is [−3.49, 1.18]]

.box-6.small[b₃'s standard error is 1.19, over twice the 0.50 for the overall gap. Only 125 students are boys, and that limits this test]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

The four steps one last time.

df = n − 4, because the model spends one df on each of its four numbers.

A common mistake: "It's significant for one group and not the other, so the effect differs." Test the interaction itself. Here both groups clear the bar on their own: boys alone, t = 3.65; girls alone, t = 4.18.

With no sign of an interaction, we go back to one effect for everyone: 2.69.

# Spread hides a gap

&lt;img src="14-regression-groups_files/figure-html/spread-plot-1.png" alt="Two panels, each with two rows of dots for a control group and a program group. In both, the group means are 10 and 14, marked with a tick. In the left panel, each group's dots spread widely and the groups overlap heavily. In the right panel, each group's dots sit tight around its mean, so the gap stands out." width="84%" style="display: block; margin: auto;" /&gt;

.box-3.small[That's more power, so less risk of a Type 2 error. α stays at 0.05]

.source[After a figure in Gravetter et al., *Essentials of Statistics for the Behavioral Sciences*, 10e. Scores made up.]

???

This is Thursday's first way to narrow the pile: tight dots. Students differ for many reasons that have nothing to do with the program, and all of it lands in the residuals and goes to the bottom of the fraction.

We can't change the students. But if we can explain some of those differences with another predictor, they stop counting as misses.

The 2024 slide said this lowers the chance of a Type 1 error. That's set by α. Less spread lowers the Type 2 error rate.

# The lottery earns the word "caused"

.box-inv-3.small.sp-after-half[We can't watch the same student both with and without Mindspark]

.box-inv-3.small.sp-after-half[A lottery sorts students by chance. So motivation, family and past scores balance out on average, even the things nobody measured]

.box-inv-3.small.sp-after-half[Apart from chance, the program is then the only thing that differs between the groups]

.box-3.small[And our test deals with chance: t(537) = 5.37. What's left is the program]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Topic 9 said this for one gap. Now it holds for a whole family of models.

Three honest limits, if someone asks. One: the lottery set who was offered a place, so strictly this is the effect of winning a place, not of a set amount of Mindspark. Two: a lottery protects the groups as drawn, and 89.5% of control students and 84.7% of Mindspark students were still there at endline (p = 0.097). A gap in who stayed could bend the comparison. Three: this is one group of students in Delhi. "Caused" means here, not everywhere.
