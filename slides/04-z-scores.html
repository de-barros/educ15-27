# z-scores and locations

---

layout: true
class: title title-1

---

# Andy scored 19. Is that good?

&lt;img src="04-z-scores_files/figure-html/andy-plot-1.png" alt="Bar chart of baseline math scores for 619 Mindspark students, from 0 to 26 out of 35. The bars peak near 12. A dashed vertical line marks Andy's score of 19, far out on the right side, where the bars are short." width="84%" style="display: block; margin: auto;" /&gt;

.source[Data: Muralidharan, Singh, and Ganimian (2019). 619 students in Delhi.]

???

Andy isn't a real student in the data, but real students did score 19. Ask: how would you say how typical or unusual this score is? It's only 19 out of 35, so is that bad? A raw score means little until we know where the other scores are.

---

# Measure the distance in SDs

&lt;img src="04-z-scores_files/figure-html/ruler-plot-1.png" alt="The same bar chart with a solid line at the mean of 11.12 and a dashed line at Andy's score of 19. An arrow between them is labeled as a deviation of 7.88 points. Above it, a ruler of two segments, each one standard deviation of 3.90 points long, reaches almost exactly from the mean to Andy." width="82%" style="display: block; margin: auto;" /&gt;

.box-inv-1.small[Each SD is 3.90 points. Andy's 7.88 points are 7.88 / 3.90 = 2.02 SDs]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Four questions. What's typical? The mean. How far is Andy from it? The deviation. How much do scores vary overall? The SD. So how many SDs away is he?

---

# A z-score counts SDs from the mean

$$
z = \frac{X - \mu}{\sigma} = \frac{19 - 11.12}{3.90} = 2.02
$$

.pull-left[
.box-inv-1.small[X − μ]

How far the score is from the mean, in points. This is the deviation from Tuesday
]

.pull-right[
.box-inv-1.small[σ]

The ruler. It says how big a step is in this distribution
]

.box-1.small[Treat the 619 students as a population: μ = 11.12 and σ = 3.90]

???

The z has no units. Points divided by points. That's why it will work across different tests later today.

---

# Sign: which side. Size: how far

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:center;"&gt; Score X &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Deviation X − μ &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; z &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; In words &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;

  &lt;/tr&gt;
  &lt;tr&gt;

  &lt;/tr&gt;

.box-inv-1.small[z = 0 is the mean. Most of these students sit between z = −2 and z = +2: 94% of them]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

---

# From a z-score back to a score

$$
X = \mu + z\sigma = 11.12 + 2.02 \times 3.90 = 19.00
$$

.pull-left-3[
.box-inv-1.small[First, read the z]

.center[z = 2.02, so Andy is above the mean]
]

.pull-middle-3[
.box-inv-1.small[Then go back to points]

.center[2.02 × 3.90 = 7.88 points away]
]

.pull-right-3[
.box-inv-1.small[Last, add the mean]

.center[11.12 + 7.88 = 19.00]
]

???

If you round z to 2, you get 18.92, not 19. Keep two decimals along the way. The lab and the homework will say how much to round.

---

# A sample works the same way

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt;   &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Score to z &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; z to score &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Population &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; \(z = \dfrac{X - \mu}{\sigma}\) &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; \(X = \mu + z\sigma\) &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Sample &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; \(z = \dfrac{X - M}{\hat{\sigma}}\) &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; \(X = M + z\hat{\sigma}\) &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-inv-1.small[
Tuesday's five: M = 12.2 and σ̂ = 2.86. In this sample, the 16 has z = 1.33
]

.book-tag[
In the book: σ̂ is written s
]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Same idea, different symbols. Greek means population, and a Latin letter or a hat means an estimate. A z-score in a sample uses the estimates.

# Transforming distributions

---

layout: true
class: title title-6

---

# A 19 means nothing by itself

&lt;img src="04-z-scores_files/figure-html/twelve-plot-1.png" alt="Bar chart of baseline math scores with the mean and Andy's score of 19 marked by vertical lines." width="84%" style="display: block; margin: auto;" /&gt;

.box-inv-6.small[It's only a label. We could relabel every score, and everyone would keep their place]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

---

# Subtract 10: the labels slide

&lt;img src="04-z-scores_files/figure-html/minus-plot-1.png" alt="The same bars with a new axis, running from −10 to 14. The mean is now 1.12 and Andy's score is now 9. The picture is the same." width="84%" style="display: block; margin: auto;" /&gt;

.box-inv-6.small[Mean: 11.12 → 1.12. The SD stays at 3.90. Andy is still 2.02 SDs above the mean]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

---

# Multiply by 10: the labels stretch

&lt;img src="04-z-scores_files/figure-html/times-plot-1.png" alt="The same bars with a new axis, running from 0 to 240. The mean is now 111.2 and Andy's score is now 190. The picture is the same." width="84%" style="display: block; margin: auto;" /&gt;

.box-inv-6.small[Mean: 11.12 → 111.2. SD: 3.90 → 39.0. Andy is still 2.02 SDs above the mean]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

---

# Do both: subtract, then multiply

&lt;img src="04-z-scores_files/figure-html/both-plot-1.png" alt="The same bars with a new axis, running from −100 to 140. The mean is now 11.2 and Andy's score is now 90. The picture is the same." width="84%" style="display: block; margin: auto;" /&gt;

.box-inv-6.small[Mean: 11.12 → 11.2. SD: 3.90 → 39.0. Andy is still 2.02 SDs above the mean]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

---

# These only change the labels

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; Do this to every score &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Mean &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; SD &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Shape &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Add or subtract a constant &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; Moves by the constant &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; Stays the same &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; Stays the same &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Multiply or divide by a positive constant &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; Multiplied or divided &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; Multiplied or divided &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; Stays the same &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-6.small.sp-after-half[We call these "scale-invariant" transformations]

.box-inv-6.small[They keep the shape and the relative distances between students]

???

The SD ignores a shift because it's built from distances between scores and the mean. Both move together, so the distances don't change.

---

# Squaring changes the shape

&lt;img src="04-z-scores_files/figure-html/square-plot-1.png" alt="Two bar charts. The left one shows math scores, close to symmetric. The right one shows the same scores squared, with a peak near 140 and a long tail to the right." width="88%" style="display: block; margin: auto;" /&gt;

.box-inv-6.small[Now 4 and 6 are 20 apart, but 18 and 20 are 76 apart]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Not every transformation is a relabeling. Both pairs of students were 2 points apart. After squaring, 4 and 6 become 16 and 36, while 18 and 20 become 324 and 400. So this isn't a relabeling. It changed who is close to whom.

# Standardized distributions

---

layout: true
class: title title-3

---

# A z-score is the same kind of relabeling

$$
z = \frac{X - \mu}{\sigma}
$$

.pull-left[
.box-inv-3.small[Subtract one constant]

That constant is the mean
]

.pull-right[
.box-inv-3.small[Divide by another constant]

That constant is the standard deviation
]

.box-3.small[Do it to every score and you get a *standardized* distribution]

---

# Same picture, new axis: mean 0, SD 1

&lt;img src="04-z-scores_files/figure-html/z-axis-plot-1.png" alt="The same bars of math scores with two axes. The bottom axis shows raw scores. The top axis shows z-scores from −3 to 4, with 0 at the mean of 11.12. Andy's score of 19 lines up with a z-score of 2.02." width="84%" style="display: block; margin: auto;" /&gt;

.box-inv-3.small[The z-scores have mean 0.00 and SD 1.00. Every student keeps their place]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

The book draws this with a normal curve. Here it's the real data. Nothing moved: we printed a second ruler on the plot.

---

# z-scores don't make a shape normal

&lt;img src="04-z-scores_files/figure-html/shape-plot-1.png" alt="Two bar charts with the same right-skewed shape. The left one shows the squared math scores on their own axis. The right one shows the same values after standardizing, with mean 0 and SD 1. The shape is identical." width="88%" style="display: block; margin: auto;" /&gt;

.box-inv-3.small[A skewed distribution stays skewed. Only the axis changes]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

This is a common mistake. Standardizing moves the center and sets the spread. It can't touch the shape. Math scores look bell-shaped because they already were.

---

# We can add labels we like better

$$
\text{New score} = \text{new mean} + z \times \text{new SD}
$$

.pull-left[
.box-inv-3.small[Mean 500, SD 100]

.center[Andy: 500 + 2.02 × 100 = **702**]
]

.pull-right[
.box-inv-3.small[Mean 100, SD 15]

.center[Andy: 100 + 2.02 × 15 = **130**]
]

.box-3.small[Same student, same place. Nobody needs to see a negative score or a decimal]

???

Why not stop at z? People don't like being told their score is −0.54. So test makers go one step further. It's one more scale-invariant transformation.

Tests like the SAT and GRE report a scaled score and a percentile. Each testing program picks its own scale, and the percentile comes from the people who took it.

The study's scaled scores come from a measurement model, not from this simple formula. The idea of reporting in SDs is the same. Don't go further than that unless someone asks.

# A 19 in math beats a 19 in Hindi

&lt;img src="04-z-scores_files/figure-html/compare-plot-1.png" alt="Two bar charts of baseline scores, on the same axis. Math has mean 11.12 and SD 3.90, and a score of 19 has a z-score of 2.02, far in the right tail. Hindi has mean 12.84 and SD 4.94, and a score of 19 has a z-score of 1.25, closer to the middle." width="86%" style="display: block; margin: auto;" /&gt;

.box-inv-3.small[Percent correct says Hindi: 63% against 54%. z-scores say math: 2.02 against 1.25]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Ask first: which test did Andy do better on? The tests differ in length, average and spread, so raw scores can't be compared. z-scores have no units, so they can. 2 real students scored 19 on both tests.

Andy beat 97% of students in math and 86% in Hindi.
