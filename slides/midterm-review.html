# Practice 2: One score or a mean?

.box-inv-8.small.sp-after-half[Treat all 619 students as a population, with μ = 11.12 and σ = 3.90. Treat their scores as normal]

.pull-left[
.box-8.small.sp-after-half[**a.** What share of students score above 15?]

.box-8.small.sp-after-half[**b.** What score is the 25th percentile?]
]

.pull-right[
.box-8.small.sp-after-half[**c.** We draw samples of 16. What are the mean and SD of the sample means?]

.box-8.small.sp-after-half[**d.** In what share of those samples is M above 12.5?]
]

.box-inv-8.small[Sketch a curve and shade it before you open the table]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

About 8 minutes, with the unit normal table. Common slips: reading the body when the question wants the tail, and using σ instead of σ&lt;sub&gt;M&lt;/sub&gt; in part d.

---

class: title title-8

# Practice 2: Answers a and b

.pull-left[
.box-inv-8.small.sp-after-half[**a.** z = (15 − 11.12) / 3.90 = 0.99]

.box-inv-8.small.sp-after-half[The tail beyond z = 0.99 is **0.1611**, about 16% of students]
]

.pull-right[
.box-inv-8.small.sp-after-half[**b.** A tail of 0.2500 is closest at z = 0.67. Below the mean, that's z = −0.67]

.box-inv-8.small.sp-after-half[X = 11.12 + (−0.67) × 3.90 = **8.51**]
]

.box-8.small[Going right: X to z to area. Going left: area to z to X]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

For part b, the table lists only positive z. The 25th percentile is below the mean, so find the tail closest to 0.2500, then make z negative. 0.67 gives 0.2514 and 0.68 gives 0.2483, so 0.67 is closer.

The normal curve is a model. In the real data, 11.6% of the 619 scored above 15, because scores are whole numbers and the shape isn't a perfect bell. Use the model on the exam unless a question gives you the raw scores.

---

class: title title-8

# Practice 2: Answers c and d

&lt;img src="midterm-review_files/figure-html/means-plot-1.png" alt="Two normal curves centered at 11.12. The wide one is the population of single scores, with SD 3.90. The tall narrow one is the distribution of means of 16 students, with SD 0.975. A dashed line at 12.5 cuts off a thin tail of the narrow curve, shaded red, which is 0.0778 of its area." width="88%" style="display: block; margin: auto;" /&gt;

.box-inv-8.small.sp-after-half[**c.** The mean of the means is 11.12. σ&lt;sub&gt;M&lt;/sub&gt; = 3.90 / √16 = **0.975**]

.box-inv-8.small[**d.** z = (12.5 − 11.12) / 0.975 = 1.42, and the tail beyond it is **0.0778**]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

The picture is the point: a mean of 16 students is much less spread out than one student, so a mean above 12.5 is rarer than a single score above it. That's σ&lt;sub&gt;M&lt;/sub&gt; = σ / √n, and it's why tests work at all.

The central limit theorem lets us use the normal curve for means of 16 even if single scores weren't quite normal.

# Practice 3: Answer

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; Step &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; Our numbers &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 1. State H₀ &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; H₀: μ = 11.12. H₁: μ ≠ 11.12 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 2. Set the criteria &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; α = 0.05, two tails, so z beyond ±1.96 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 3. Observe &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; σ&lt;sub&gt;M&lt;/sub&gt; = 3.90 / √82 = 0.431, so z = (11.60 − 11.12) / 0.431 = 1.11 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 4. Decide &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; &lt;strong&gt;Maintain H₀&lt;/strong&gt;: z = 1.11 is inside ±1.96, p = 0.265 &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-8.small.sp-after-half[Govindpuri's mean isn't surprisingly far from 11.12]

.box-inv-8.small[Maintain, not accept: the test can't show that Govindpuri's μ is exactly 11.12]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Topic 7's ninth graders gave a reject with the same recipe. This one maintains, and the wording matters as much as the arithmetic.

For anyone who asks: Govindpuri's students are part of the 619, which makes the true standard error a little smaller. It doesn't change the decision.

.box-inv-8.small.sp-after-half[Chhatarpur's 32 ninth graders: M = 12.62 and SS = 299.5 at baseline]

.pull-left[
.box-8.small.sp-after-half[**a.** Test H₀: μ = 11.12 with α = 0.05 and two tails. Find σ̂, σ̂&lt;sub&gt;M&lt;/sub&gt; and t]

]

.pull-right[
.box-8.small.sp-after-half[**c.** Find g, and say whether it's large]

]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

class: title title-8

# Practice 4: Answers a and b

.pull-left[
.box-inv-8.small.sp-after-half[σ̂ = √(299.5 / 31) = **3.11**]

.box-inv-8.small.sp-after-half[σ̂&lt;sub&gt;M&lt;/sub&gt; = 3.11 / √32 = **0.549**]

.box-inv-8.small[t = (12.62 − 11.12) / 0.549 = **2.74**]
]

.pull-right[
.box-inv-8.small.sp-after-half[**b.** Use df = 30, the next lower row. Its cutoff is ±2.042]

.box-inv-8.small[A lower df has a wider cutoff, so it's the cautious choice]
]

.box-8.small[2.74 is beyond ±2.042: **reject H₀**. t(31) = 2.74, p = 0.010]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Report the real df, 31, even though the cutoff came from the row for 30. The exact cutoff for 31 is 2.040, so the decision is the same.

---

class: title title-8

# Practice 4: Answers c and d

.pull-left[
.box-inv-8.small.sp-after-half[**c.** g = (12.62 − 11.12) / 3.11 = **0.48**]

.box-inv-8.small[About half an SD. Large next to the effects of real education programs in Topic 7's table]
]

.pull-right[
.box-inv-8.small.sp-after-half[**d.** 12.62 ± 2.042 × 0.549 = **[11.50, 13.75]**]

.box-inv-8.small[It doesn't hold 11.12, which matches the reject]
]

.box-8.small[The test says real. g says how big. The interval says how sure. None of them says why: these are older students]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

g divides by σ̂, not σ̂&lt;sub&gt;M&lt;/sub&gt;. That's the most common mix-up on this part. g doesn't change with n, and t does.

Why: they're in grade 9, two or three grades above most of the 619. The test can only say that the gap is too big for sampling error.
