# Eight students at a time, the line swings

&lt;img src="13-regression-inference_files/figure-html/swing-plot-1.png" alt="The scatter plot of 539 students in pale dots, with baseline math on the horizontal axis and endline math on the vertical axis. A thick dark line shows their slope of 0.76. Thirty thin lines, one from each random sample of 8 students, cross it at many angles. Some are nearly flat, and others are much steeper." width="82%" style="display: block; margin: auto;" /&gt;

.box-inv-1.small[Treat our 539 students as a population. Each sample of 8 gets its own line]

.source[Data: Muralidharan, Singh, and Ganimian (2019). Samples drawn by computer, with replacement. Dots are nudged.]

???

Thursday ended with three slopes: −2.50, 2.25 and 0.76. Same test, same schools. Here's why. Every thin line is a line we might have reported, if a different 8 students had landed in our sample.

Each thin line only runs across its own sample's baseline scores. The short ones are samples with little spread in X, and they swing the most. Hold that thought for the poll.

---

???

The rule from Topic 3 again. Greek means population. The 2024 slides wrote "beta = 2.25", which was a slip: 2.25 is an estimate.

We don't write α for the population's intercept, because α already has a job as well.

**Press +1 a few times.** A sample of 8 falls from panel 1 to panel 2, gets its own line, and one b drops into panel 3. Then press +50.

Same story as M and r. The pile is centered on the true slope, 0.50. The population line is Y = 2.00 + 0.50X. It's in plain numbers, not in points on our test.

Panel 3's axis fits itself to each preset, so read its numbers before comparing two views.

# Our 8 students' b came from the far tail

&lt;img src="13-regression-inference_files/figure-html/pile-plot-1.png" alt="Histogram of b across 20,000 samples of 8 students, drawn from all 539. It's centered on 0.76, the slope of all students, and most values fall between −0.48 and 1.87. A red line at 2.25, the slope of our 8 students, sits far out in the right tail." width="82%" style="display: block; margin: auto;" /&gt;

.box-inv-1.small[The middle 95% runs from −0.48 to 1.87, and only 0.9% of samples reach 2.25. The SD of this pile is the standard error of b]

.source[Data: Muralidharan, Singh, and Ganimian (2019). 20,000 samples of 8, drawn with replacement.]

???

The same pile, on our own students. Here we know the answer, because we're treating the 539 as the population, so β = 0.76. In real research, panel 1 goes dark, and one sample has to tell us how wide the pile is. That's the job of block 2.

Students 25 to 32 aren't a random sample, just neighbors in a file. Their slope is high partly because their baseline scores sit so close together, which is the next point.

# Testing the slope

---

layout: true
class: title title-6

---

# Steps 1 and 2: H₀ says the line is flat

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; Step &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; In words &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; Our 8 students &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 1. State H₀ &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Baseline predicts nothing about endline, in the population &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; H₀: β = 0&lt;br&gt;H₁: β ≠ 0 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 2. Set the criteria &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Two tails, α = 0.05, and a t curve &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; df = n − 2 = 6&lt;br&gt;t(6) beyond ±2.447 &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-6.small[We found b = 2.25. Would a slope that steep be surprising, if the true line were flat?]

.source[Data: Muralidharan, Singh, and Ganimian (2019). Students 25 to 32.]

???

Back to our 8 students from Thursday. Two tails is our default. Why n − 2? The line spends two degrees of freedom, one on a and one on b. Topic 11 got the same df from the two means.

H₀ doesn't have to be 0. It's almost always 0, because "no relationship" is the question people ask.

---

# Under H₀, sample lines still tilt

&lt;div class="sim-slide" style="height: 495px;"&gt;
&lt;iframe class="sim-live" src="../simulator/index.html?ui=slide&amp;step=7&amp;n=8&amp;d=0&amp;a=2&amp;view=stat&amp;draws=551&amp;seed=15" title="Simulator at step 7a with 551 samples of 8 pairs from a population with a flat line, Y = 2.00 + 0.00 X. Panel 2 shows one sample whose own line tilts anyway. Panel 3 shows t values stacked along a t curve with 6 degrees of freedom, with cutoffs near plus and minus 2.45." loading="lazy"&gt;&lt;/iframe&gt;
&lt;img class="sim-static" src="img/sim/e63e750a72f6.png" alt="Simulator at step 7a with 551 samples of 8 pairs from a population with a flat line, Y = 2.00 + 0.00 X. Panel 2 shows one sample whose own line tilts anyway. Panel 3 shows t values stacked along a t curve with 6 degrees of freedom, with cutoffs near plus and minus 2.45."&gt;
&lt;/div&gt;

.source[Simulator after Kristoffer Magnusson, rpsychologist.com.]

???

Here β = 0, the world H₀ describes. The population line is flat, yet panel 2's line still tilts. Panel 3 turns each b into a t. About 5% of them land beyond the cutoffs, which are the ±2.447 from step 2.

**Press +1 a few times** and watch a dot land past a cutoff now and then. Each one is a Type 1 error.

---

# Three things narrow the pile

&lt;div class="math-display"&gt;\[
\hat{\sigma}_b = \sqrt{\frac{MS_{residual}}{SS_X}}
\qquad \text{where} \qquad
MS_{residual} = \frac{SS_{residual}}{n - 2}
\]&lt;/div&gt;

.pull-left-3[
.box-inv-6.small[Tight dots: small MS&lt;sub&gt;residual&lt;/sub&gt;]
]

.pull-middle-3[
.box-inv-6.small[Wide X: big SS&lt;sub&gt;X&lt;/sub&gt;]
]

.pull-right-3[
.box-inv-6.small[More students: big SS&lt;sub&gt;X&lt;/sub&gt;]
]

.box-6.small[It has the shape of σ̂&lt;sub&gt;M&lt;/sub&gt; = σ̂ / √n: the scatter, over how much information we have]

.book-tag[In the book: √MS&lt;sub&gt;residual&lt;/sub&gt; is the standard error of estimate. Software calls σ̂&lt;sub&gt;b&lt;/sub&gt; the "Std. Error"]

???

MS residual is the average squared miss from Thursday, with n − 2 on the bottom. It's our estimate of the variance around the line.

Students don't need to derive this. They should be able to say why each of the three things helps. The first was the loose and tight dots on Thursday, and the second was the poll.

---

# Step 3: The same fraction again

&lt;div class="math-display"&gt;\[
MS_{residual} = \frac{58.5}{6} = 9.75
\qquad\qquad
\hat{\sigma}_b = \sqrt{\frac{9.75}{24}} = 0.637
\]&lt;/div&gt;

&lt;div class="math-display"&gt;\[
t = \frac{b - \beta}{\hat{\sigma}_b} = \frac{2.25 - 0}{0.637} = 3.53
\]&lt;/div&gt;

.pull-left[
.box-inv-6.small[Top: how far b is from H₀'s β of 0]
]

.pull-right[
.box-inv-6.small[Bottom: how far a b typically falls]
]

.box-6.small[3.53 is beyond ±2.447, so we reject H₀: t(6) = 3.53, p = 0.012]

.source[Data: Muralidharan, Singh, and Ganimian (2019). Students 25 to 32. SS&lt;sub&gt;residual&lt;/sub&gt; is from Topic 12, SS&lt;sub&gt;X&lt;/sub&gt; from Topic 11.]

???

SS residual = 58.5 is the "Least squares" total from Thursday's curve. SS&lt;sub&gt;X&lt;/sub&gt; = 24 is from Topic 11.

Decision wording as in Topic 7: this slope would be surprising if the true line were flat, so we reject H₀.

---

# It's Topic 11's t, to the last decimal

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; Our 8 students &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; Bottom of the fraction &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; t &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Topic 11: test r &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; σ̂&lt;sub&gt;r&lt;/sub&gt; = √((1 − r²) / (n − 2)) = 0.233 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; 0.822 / 0.233 = &lt;strong&gt;3.53&lt;/strong&gt; &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Today: test b &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; σ̂&lt;sub&gt;b&lt;/sub&gt; = √(MS&lt;sub&gt;residual&lt;/sub&gt; / SS&lt;sub&gt;X&lt;/sub&gt;) = 0.637 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; 2.25 / 0.637 = &lt;strong&gt;3.53&lt;/strong&gt; &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-inv-6.small.sp-after-half[b is r, rescaled into points. The same rescaling turns σ̂&lt;sub&gt;r&lt;/sub&gt; into σ̂&lt;sub&gt;b&lt;/sub&gt;, so the fraction doesn't change]

.box-6.small[H₀: ρ = 0 and H₀: β = 0 are one question. If r is 0, b is 0]

.source[Data: Muralidharan, Singh, and Ganimian (2019). Students 25 to 32.]

???

Topic 12 showed b = r × σ̂&lt;sub&gt;Y&lt;/sub&gt; / σ̂&lt;sub&gt;X&lt;/sub&gt;. Multiply the top and bottom of Topic 11's fraction by that same ratio, and you get today's fraction. In numbers, 0.233 × 2.739 = 0.637.

The 2024 deck got 3.51 from r rounded to 0.82, and said the two routes differ by rounding. With three decimals in r, they agree.

---

# Eight students or 539: reject H₀

&lt;table class="deck-table tight"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; Step &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; Our 8 students &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; All 539 students &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 1. State H₀ &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; β = 0 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; β = 0 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 2. Set the criteria &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; t(6) beyond ±2.447 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; t(537) beyond ±1.964 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 3. Find the spread &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; σ̂&lt;sub&gt;b&lt;/sub&gt; = √(9.75 / 24) = 0.637 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; σ̂&lt;sub&gt;b&lt;/sub&gt; = √(26.66 / 8,269) = 0.057 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 3. Compute t &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; b = 2.25, t = 3.53 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; b = 0.76, t = 13.46 &lt;/td&gt;

# An interval for β, the Topic 8 way

&lt;img src="13-regression-inference_files/figure-html/interval-plot-1.png" alt="Two horizontal 95 percent intervals for the slope, with a dashed vertical line at 0. For our 8 students, the interval runs from 0.69 to 3.81 around 2.25. For all 539 students, it runs from 0.65 to 0.88 around 0.76. Neither interval reaches 0." width="90%" style="display: block; margin: auto;" /&gt;

.pull-left[
.box-inv-6.small[8 students: 2.25 ± 2.447 × 0.637]
]

.pull-right[
.box-inv-6.small[All 539: 0.76 ± 1.964 × 0.057]
]

.box-6.small[Neither interval holds 0, so both tests reject. It's the rule from Topic 8]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Same recipe as Topic 8: the t cutoff from step 2, times the standard error. Students could do this on a calculator. The interval says something a t alone doesn't: with all 539, a point at baseline goes with about 0.65 to 0.88 points at endline.

The 95% is about the method, as in Topic 8, not about this one interval. The test also assumes the line is straight and the misses are independent, which is another reason to plot first.

"Is the slope real?" has a modest answer. It says we don't think the true line is flat. Nobody doubted that baseline and endline math scores go together, so H₀ was a low bar here.

The same point came up with effect sizes in Topic 8 and with correlation in Topic 11. Topic 14 uses a slope that a lottery set, where the third question gets a better answer.

]

.source[After Gravetter et al., *Essentials of Statistics for the Behavioral Sciences*, 10e. Data: Muralidharan et al. (2019).]

???

Thursday's bars split SS&lt;sub&gt;Y&lt;/sub&gt; this way, with the same numbers. This is the "analysis of regression". What X predicts goes on top of F, and what's left over goes on the bottom. A line has one slope, so regression gets 1 df.

r² is the only link between the two pieces: 0.675 × 180.0 = 121.5.

# One test, three ways

&lt;table class="deck-table tight"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt;   &lt;/th&gt;

  &lt;/tr&gt;
  &lt;tr&gt;

   &lt;td style="text-align:left;"&gt; t = b / σ̂&lt;sub&gt;b&lt;/sub&gt; &lt;/td&gt;

  &lt;/tr&gt;

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

Topic 10 showed F = t² for two groups. It's the same fact, and the same reason: squaring folds t's two tails into F's one.

13.46² = 181.2, which is the 181.2 in the last column.

When Topic 14 adds a second predictor, each slope gets its own t, and F tests them all together. Then they're no longer the same number.
