# What is probability?

---

layout: true
class: title title-1

---

# Probability is a share of outcomes

$$
p(A) = \frac{\text{outcomes that count as } A}{\text{all possible outcomes}}
$$

.pull-left[
.box-inv-1.small[
Roll a fair die: p(6) = 1 / 6 = 0.167
]
]

.pull-right[
.box-inv-1.small[
A share always lies between 0 (never) and 1 (always)
]
]

.box-1.small[0.25, 1 in 4 and 25% all say the same thing]

???

Proportion, probability and percentage are the same idea here. We'll move between them all quarter.

---

# This only works if we draw at random

.pull-left[
.box-1.medium[Random]

Everyone has the same chance of being picked
]

.pull-right[
.box-1.medium[Independent]

One draw doesn't change the chances for the next
]

.box-inv-1.small[
Together these are called *independent and identically distributed*, or i.i.d. Every formula in this course leans on it
]

???

A friend-of-a-friend survey isn't random. Picking a whole classroom isn't independent: classmates share a teacher. Picking one student and putting them back keeps the chances the same on every draw.

---

# Pretend these 619 are everyone

&lt;img src="05-probability_files/figure-html/pretend-plot-1.png" alt="Bar chart of how many of the 619 students got each baseline math score. Scores run from 0 to 26, and the tallest bar is 76 students at a score of 12." width="78%" style="display: block; margin: auto;" /&gt;

.box-inv-1.small[They're really a sample from Delhi. For today they're everyone, so we write μ = 11.12 and σ = 3.90]

.source[Data: Muralidharan, Singh, and Ganimian (2019). 619 students in Delhi.]

???

Greek letters, no hats, because today we know everybody. We come back to this same trick in Topic 6, when we draw many samples from these 619 students.

---

# Pick one student: what's p(12)?

&lt;img src="05-probability_files/figure-html/bar-12-1.png" alt="The same bar chart with the bar at a score of 12 picked out in a dark color. It holds 76 of the 619 students." width="82%" style="display: block; margin: auto;" /&gt;

--

.box-1.small[p(X = 12) = 76 / 619 = 0.123]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Ask first, then show the answer. The tallest bar is simply the most likely score.

---

# A range of scores just adds up bars

&lt;img src="05-probability_files/figure-html/bar-range-1.png" alt="The same bar chart with every bar from 0 to 12 picked out in a dark color. Together they hold 405 of the 619 students." width="82%" style="display: block; margin: auto;" /&gt;

--

.box-1.small[p(X ≤ 12) = (2 + 1 + 4 + … + 76) / 619 = 405 / 619 = 0.654]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

# From bars to curves

---

layout: true
class: title title-6

---

# Shares make a probability distribution

&lt;img src="05-probability_files/figure-html/prop-plot-1.png" alt="The same bars of Mindspark scores, now with proportion of students on the vertical axis. The tallest bar is 0.123 at a score of 12." width="78%" style="display: block; margin: auto;" /&gt;

.box-inv-6.small[Same shape, new axis. Each bar is now a probability, and all the bars add up to 1]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Scores here are whole numbers from 0 to 26, so we can list every outcome. The word for the general idea is a probability distribution. The book reserves "density" for the continuous case, which is next.

---

# Continuous scores can't be counted

&lt;img src="05-probability_files/figure-html/narrow-bars-1.png" alt="Three bar charts of the same normal curve with mean 11.12 and standard deviation 3.90. With bars 4 points wide the tallest bar is about 0.38. With bars 1 point wide it is about 0.10. With bars a quarter of a point wide it is about 0.03. The bars get shorter as they get narrower." width="92%" style="display: block; margin: auto;" /&gt;

.box-inv-6.small[A continuous variable has endless possible values. The chance of any one exact value is zero]

???

Think of time spent on a test. Exactly 12.000000 minutes never happens. The bars shrink toward nothing, so we stop asking about single values and ask about ranges.

---

# Density: where probability piles up

&lt;img src="05-probability_files/figure-html/density-plot-1.png" alt="A smooth bell curve of density over scores from 0 to 26. A label near the peak says scores crowd together here. A label near the right tail says they thin out here." width="82%" style="display: block; margin: auto;" /&gt;

.box-inv-6.small[Height isn't a probability. It tells you how concentrated the probability is around that point]

---

# Ask about ranges: area is the answer

&lt;img src="05-probability_files/figure-html/area-plot-1.png" alt="The Mindspark bars drawn touching each other with a smooth curve over them. Every bar from 0 to 12 is dark. The dark bars cover 0.654 of the total area." width="72%" style="display: block; margin: auto;" /&gt;

.box-6.small.sp-after-half[What's the chance of 12 or below?]

--

.box-inv-6.small[The whole area is 1, and the dark area is 405 / 619 = 0.654: the same answer as counting]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

.box-8.small[Probability is area. Height alone can't tell you]

# The normal distribution

---

layout: true
class: title title-3

---

# A bell curve, set by just two numbers

.pull-left[
&lt;img src="05-probability_files/figure-html/bell-plot-1.png" alt="A symmetric bell curve. A vertical line at the peak is labeled mean, median and mode." width="100%" style="display: block; margin: auto;" /&gt;
]

.pull-right[
.box-inv-3.small[Symmetric, so one side mirrors the other]

.box-inv-3.small[Most common in the middle]

.box-inv-3.small[Tapers off toward both ends]

$$
Y = \frac{1}{\sqrt{2\pi\sigma^2}}\, e^{-(X - \mu)^2 / 2\sigma^2}
$$
]

.box-3.small[Only μ and σ change. You'll never compute this by hand]

???

It's a common shape for populations, which is why we start here. Look at the formula once: only two parameters, both Greek, so the curve describes a population. Everything else is a constant.

---

# Every normal curve splits the same way

&lt;img src="05-probability_files/figure-html/sections-plot-1.png" alt="A normal curve divided at each standard deviation. From the mean to 1 standard deviation holds 34.13%. From 1 to 2 holds 13.59%. Beyond 2 holds 2.28%. The left side mirrors the right." width="86%" style="display: block; margin: auto;" /&gt;

.box-inv-3.small[Each mark is one standard deviation. The areas are always the same]

???

The tail sections hold everything beyond 2, so the outer labels sit a little above the thin curve. Each side adds up to 50%.

---

# The standard normal relabels the axis

&lt;img src="05-probability_files/figure-html/relabel-plot-1.png" alt="A normal curve with two axes. The bottom axis shows z-scores from minus 3 to 3. The top axis shows the same points as math scores, with the mean of 11.12 above z equals 0." width="84%" style="display: block; margin: auto;" /&gt;

.box-inv-3.small[z = (X − μ) / σ moves the mean to 0 and the SD to 1. The shape doesn't change]

???

This is Topic 4's z-score. A standard normal distribution is a normal distribution in z-score units. A normal curve doesn't have to be standardized, but once it is, the sections sit at whole numbers.

---

# Our 619 scores stay close to the curve

&lt;img src="05-probability_files/figure-html/check-plot-1.png" alt="Bars of the Mindspark scores as proportions, with a normal curve of mean 11.12 and standard deviation 3.90 drawn over them. The curve follows the bars closely." width="82%" style="display: block; margin: auto;" /&gt;

.box-inv-3.small[Within 1 σ: 71% of students, 68% of the curve. Within 2 σ: 94% and 95%]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Close, not perfect, and that's normal for real data. The curve even gives some area to scores below zero, which can't happen.

---

# Area is probability, so we can read it off

&lt;img src="05-probability_files/figure-html/read-off-1.png" alt="Two normal curves. On the left, the area from z equals 1 to z equals 2 is shaded. On the right, the area beyond z equals 2 is shaded." width="90%" style="display: block; margin: auto;" /&gt;

.box-3.small.sp-after-half[Draw one person from a normal population. What's the chance of each?]

--

.pull-left[
.box-inv-3.small[p(1 &lt; z &lt; 2) = 0.1359]
]

.pull-right[
.box-inv-3.small[p(z &gt; 2) = 0.0228]
]

???

Both come straight from the sections on the previous slide. A probability that small is what we'll later call weird.

# Percentile rank: the share at or below

.box-7.medium.sp-after-half[1200 has a percentile rank of 77]

.box-inv-7.small.sp-after-half[
23% scored above it, so 100 − 23 = 77% scored at or below it
]

It's the body of the curve at that score
]

.box-inv-7.small[
Percentile rank describes a person's place in the group. It isn't the percent they got right
]

]

.source[Data: College Board, 2025 SAT Suite Annual Report, Total Group.]

???

Percentile rank starts with a score and ends with a percent. A percentile starts with a percent and ends with a score. Scores come in steps of 10, which is why 1416 becomes about 1420.
