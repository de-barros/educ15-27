# What r shows

---

layout: true
class: title title-1

---

# Each dot is one student

&lt;img src="11-correlation_files/figure-html/scatter-plot-1.png" alt="Scatter plot of 539 Mindspark students, with baseline math score on the horizontal axis and endline math score on the vertical axis. The dots form a wide cloud that rises from lower left to upper right." width="86%" style="display: block; margin: auto;" /&gt;

.source[Data: Muralidharan, Singh, and Ganimian (2019). 539 students. Dots are nudged so equal scores don't hide each other.]

???

Our question from 2024: does a student's baseline score predict their endline score? Every student has two scores, so every student is one dot.

Ask: what do you see? Students who start higher tend to end higher, but there's a lot of scatter. We aren't saying anything about what causes what yet.

---

# A correlation describes three things

&lt;img src="11-correlation_files/figure-html/features-plot-1.png" alt="Six small scatter plots of made-up data in three columns. Direction: one cloud rises and one falls. Form: one cloud follows a straight line and one follows an arch. Consistency: one cloud hugs a line tightly and one is loose." width="88%" style="display: block; margin: auto;" /&gt;

.box-inv-1.small[Which way does it go? Is it straight? How closely do the dots follow it?]

.source[Made-up data.]

???

Direction: when X goes up, does Y go up or down? Form: a straight line, or a curve? Consistency: how well does X tell you Y?

Everyday pairs: years of education and income, or hours of cat videos and happiness. A correlation says nothing about what causes what.

---

# r runs from −1 to 1

&lt;img src="11-correlation_files/figure-html/gallery-plot-1.png" alt="Four scatter plots of made-up data. With r of minus 1, the dots lie on a falling line. With r of minus 0.4, a loose falling cloud. With r of 0, a round cloud with no direction. With r of 0.9, a tight rising cloud." width="92%" style="display: block; margin: auto;" /&gt;

.box-inv-1.small.sp-after-half[The sign gives the direction. The distance from 0 gives the consistency]

.box-1.small[Our 539 students: r = 0.50. Upward, roughly straight, and loose]

.source[Top: made-up data. Bottom: Muralidharan, Singh, and Ganimian (2019).]

???

This is Pearson's correlation. Pearson's r needs a straight-line form, which is the next slide. r has no units: it doesn't matter whether we use points, percent or z-scores.

In the book, the sample value is also r. Greek ρ is the population value, and it comes in the third block.

---

# Same r, four different stories

&lt;img src="11-correlation_files/figure-html/anscombe-plot-1.png" alt="Four scatter plots from Anscombe's quartet. All have a correlation of 0.82. The first is a loose straight cloud. The second is a smooth curve. The third is a tight line with one point far above it. The fourth is a stack of points at one X value, with one distant point that creates the correlation." width="92%" style="display: block; margin: auto;" /&gt;

.box-inv-1.small.sp-after-half[r measures straight lines only. The second panel is a perfect curve, and r can't tell]

.box-1.small[Plot your data before you trust the number]

.source[Data: Anscombe (1973), four made-up data sets.]

???

Each panel has 11 points, and all four have r = 0.82. Only the first one is what r = 0.82 makes you picture. Our 8 students later today happen to have the same r. Any r can hide any of these.

# One outlier swings 8 students, not 539

&lt;img src="11-correlation_files/figure-html/ghost-plot-1.png" alt="Two scatter plots of baseline against endline math scores, each with one made-up student added at a baseline of 26 and an endline of 5. With 8 real students, r falls from 0.82 to −0.57. With all 539 students, r falls only from 0.50 to 0.48." width="92%" style="display: block; margin: auto;" /&gt;

???

The same lesson as the simulator, on our own students. Only the diamond is invented. An outlier isn't a reason to delete a student. It's a reason to look, and to report what happens with and without them.

---

# So what is a correlation good for?

.pull-left[
.box-inv-1.small[Prediction]

Baseline scores can flag who may need help, whatever the reason

.box-inv-1.small[Reliability]

The same test, given twice, should give similar scores
]

.pull-right[
.box-inv-1.small[Validity]

A new math test should correlate with an established one

.box-inv-1.small[Testing theories]

A theory says two things go together. Do they?
]

???

The first three are everyday uses in education research, and none of them needs a causal story. The fourth is where people get into trouble, which we come back to later today.

# Do the two scores move together?

&lt;img src="11-correlation_files/figure-html/quadrant-plot-1.png" alt="The eight students' scatter plot, with a dashed vertical line at the mean baseline score of 10.5 and a dashed horizontal line at the mean endline score of 22.5. The upper right and lower left corners are shaded and marked plus. The upper left and lower right are marked minus. The students farthest from the means are in the shaded corners." width="80%" style="display: block; margin: auto;" /&gt;

.box-inv-6.small[Multiply each student's two deviations. Same side of both means gives a positive product]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

This is a new idea with an old tool. For variance, we squared one deviation. Now we multiply two different deviations. If high goes with high and low goes with low, the products are mostly positive, and they add up to something big.

The dashed lines are M&lt;sub&gt;X&lt;/sub&gt; = 10.5 and M&lt;sub&gt;Y&lt;/sub&gt; = 22.5.

.book-tag[Shortcut: SP = ΣXY − (ΣX)(ΣY) / n = 1,944 − (84 × 180) / 8 = 54]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

SP is to two variables what SS is to one. SS is the sum of a deviation times itself. SP is the sum of one deviation times the other. Unlike SS, SP can be negative.

M&lt;sub&gt;X&lt;/sub&gt; = 10.5, M&lt;sub&gt;Y&lt;/sub&gt; = 22.5. The shortcut needs no deviations, like the faster formula for SS. Both formulas give 54, so students can use either one.

---

# r divides by each score's own spread

&lt;div class="math-display"&gt;\[
r = \frac{SP}{\sqrt{SS_X \, SS_Y}}
\]&lt;/div&gt;

.pull-left[
.box-inv-6.small[Top: how much X and Y move together]
]

.pull-right[
.box-inv-6.small[Bottom: how much each moves alone]
]

&lt;div class="math-display"&gt;\[
r = \frac{54}{\sqrt{24 \times 180}} = \frac{54}{65.73} = 0.822
\]&lt;/div&gt;

.box-6.small[The bottom is why r has no units, and why it stays between −1 and 1]

???

SS&lt;sub&gt;X&lt;/sub&gt; = 24 and SS&lt;sub&gt;Y&lt;/sub&gt; = 180, computed the usual way from the deviations on the last slide.

SP alone depends on the scale: score the tests out of 100, and SP grows. Dividing by the spreads removes that. r can only reach 1 when X and Y move together as much as they move at all.

# r² is the share we can predict

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; Group &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; r &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; r² &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; In words &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Our 8 students &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 0.822 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 0.675 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; 67.5% of Y's variability can be predicted from X &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; All 539 students &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 0.502 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 0.252 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; 25.2% of Y's variability can be predicted from X &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-inv-6.small.sp-after-half[r = 0.50 doesn't mean half. It means about a quarter of the variability is shared]

.box-6.small[r² works like η̂² in ANOVA: a share of the total. It's our effect size]

.book-tag[In the book: r² is the coefficient of determination]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

Say "predicted", not "caused". The share belongs to both variables, which is why it's called shared variability. It works in either direction: X predicts Y exactly as well as Y predicts X.

Topic 12 shows where this share comes from, using the distance between each dot and a line.

???

ρ is the Greek letter rho. r is a statistic, so it has a sampling distribution, like M did. That's step 6 of the blueprint. Each dot in panel 1 is now a person in the population, with an X and a Y.

---

# With 8 students, r bounces a lot

&lt;div class="sim-slide" style="height: 495px;"&gt;
&lt;iframe class="sim-live" src="../simulator/index.html?ui=slide&amp;step=6&amp;n=8&amp;d=0.5&amp;view=raw&amp;draws=2000&amp;seed=15" title="Simulator at step 6 with 2,000 samples of eight pairs from a population with a true correlation of 0.5. Panel 1 shows a rising cloud. Panel 2 shows one sample's eight dots. Panel 3 shows the values of r piled up widely, from below 0 to near 1." loading="lazy"&gt;&lt;/iframe&gt;
&lt;img class="sim-static" src="img/sim/b3cbacbf5577.png" alt="Simulator at step 6 with 2,000 samples of eight pairs from a population with a true correlation of 0.5. Panel 1 shows a rising cloud. Panel 2 shows one sample's eight dots. Panel 3 shows the values of r piled up widely, from below 0 to near 1."&gt;
&lt;/div&gt;

.source[Simulator after Kristoffer Magnusson, rpsychologist.com.]

???

Here ρ = 0.50, close to our 539 students. Samples of 8 give almost any r. Drag n up to see the pile narrow.

On real data: treat our 539 students as the population. In 20,000 samples of 8, the middle 95% of r runs from −0.27 to 0.90, and 10% of samples reach 0.82 or more. So 0.82 from 8 students is ordinary.

---

# Steps 1 and 2: H₀ says ρ = 0

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; Step &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; In words &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; Our 8 students &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 1. State H₀ &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; No relationship in the population &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; H₀: ρ = 0&lt;br&gt;H₁: ρ ≠ 0 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 2. Set the criteria &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Two tails, α = 0.05, and a t curve &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; df = n − 2 = 6&lt;br&gt;t(6) beyond ±2.447 &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-3.small[The rule stays the same: is what we saw surprising, if nothing is going on?]

???

Same four steps as every test this quarter, with two tails as our default. Why n − 2? A correlation needs both means, M&lt;sub&gt;X&lt;/sub&gt; and M&lt;sub&gt;Y&lt;/sub&gt;, and each one costs a degree of freedom.

---

# Under H₀, r still bounces

&lt;div class="sim-slide" style="height: 495px;"&gt;
&lt;iframe class="sim-live" src="../simulator/index.html?ui=slide&amp;step=6&amp;n=8&amp;d=0&amp;view=stat&amp;draws=551&amp;seed=15" title="Simulator at step 6 with 551 samples of eight pairs from a population with a true correlation of 0. Panel 3 shows t values stacked along a t curve with 6 degrees of freedom, with cutoffs near plus and minus 2.45." loading="lazy"&gt;&lt;/iframe&gt;
&lt;img class="sim-static" src="img/sim/8f94bbb7c6ef.png" alt="Simulator at step 6 with 551 samples of eight pairs from a population with a true correlation of 0. Panel 3 shows t values stacked along a t curve with 6 degrees of freedom, with cutoffs near plus and minus 2.45."&gt;
&lt;/div&gt;

.source[Simulator after Kristoffer Magnusson, rpsychologist.com.]

???

Here ρ = 0, the world H₀ describes. The round cloud in panel 1 has no relationship, but small samples still show one by chance. Panel 3 turns each r into a t. About 5% of them land beyond the cutoffs, which are the ±2.447 from step 2.

---

# Step 3: The same fraction again

&lt;div class="math-display"&gt;\[
t = \frac{r - \rho}{\hat{\sigma}_r}
\qquad \text{where} \qquad
\hat{\sigma}_r = \sqrt{\frac{1 - r^2}{n - 2}}
\]&lt;/div&gt;

.pull-left[
.box-inv-3.small[Top: how far r is from H₀'s ρ, which is 0]
]

.pull-right[
.box-inv-3.small[Bottom: how far an r typically falls]
]

.box-3.small[Ours: σ̂&lt;sub&gt;r&lt;/sub&gt; = √(0.325 / 6) = 0.233, so t = 0.822 / 0.233 = **3.53**]

.book-tag[In the book: σ̂&lt;sub&gt;r&lt;/sub&gt; is written s&lt;sub&gt;r&lt;/sub&gt;]

???

What we saw, over what chance alone would give: it's the same fraction as every t so far. The bottom shrinks with n. It also shrinks as r grows, because a tight cloud pins r down.

The 2024 deck showed 3.51, because it rounded r to 0.82 first. With r² = 0.675, it's 3.53. Keep three decimals in r when computing.

---

.box-inv-3.small.sp-after-half[Eight students: t(6) = 3.53, p = 0.012, r = 0.82]

.box-3.small[All 539: t(537) = 13.46, p &lt; 0.001, r = 0.50, 95% CI [0.44, 0.56]]

.source[Data: Muralidharan, Singh, and Ganimian (2019). Software gives the interval for r.]

???

Rejecting H₀ means this sample would be surprising if ρ were 0. It doesn't say the relationship is strong. r and r² do that.

The 8 students overstate the relationship, and the 539 pin it down. The interval for r has its own formula, which is beyond this course, so we read it from software. Every t-test since Topic 8 comes with an effect size and an interval, and this one does too.

???

Tuition: X is 1 if the family pays for any extra lessons. Stronger students may be the ones whose families pay. Or families may pay because a child is struggling. Or keen parents may do both things. The data can't tell these apart.

The lottery: X is 1 for a Mindspark spot, and nobody could choose it. Before the program, the same lottery had no detectable link to math: r = −0.05, t(537) = −1.17.

Watch for the trick of hinting at a cause in the discussion section, then retreating to "it's only a correlation" when someone objects. This is the "motte and bailey" from 2024.
