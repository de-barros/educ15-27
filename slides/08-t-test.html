# One tail or two?

---

layout: true
class: title title-1

---

# A directional hypothesis picks a side

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt;   &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; Non-directional H₀ &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; Directional H₀ &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; In symbols &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; μ = 100 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; μ ≤ 100 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Laptops in class &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Laptops don't affect learning &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Laptops don't improve learning &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Cat videos &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Cat videos don't change your happiness &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Cat videos don't make you happier &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-1.small[A directional test says which way the mean should move, not only that it moves]

???

Ask students to state the H₁ for each one. For μ = 100, H₁ is μ ≠ 100. For μ ≤ 100, H₁ is μ &gt; 100. For the laptops, H₁ is that laptops affect learning, or that they improve it.

---

# Same α, one tail: the cutoff moves in

&lt;img src="08-t-test_files/figure-html/one-tail-plot-1.png" alt="Two normal curves of z-scores. In the left curve, for a two-tailed test, 2.5 percent is shaded in each tail, beyond minus 1.96 and 1.96. In the right curve, for a one-tailed test, all 5 percent is shaded in the right tail, beyond 1.65." width="92%" style="display: block; margin: auto;" /&gt;

.box-inv-1.small[With α = 0.05 in one tail, the critical z is 1.65, not 1.96. Type I errors stay at 5%]

???

The total of 5% hasn't changed. It's only moved. The exact one-tailed value is 1.645, and the book's table rounds it to 1.65.

layout: true
class: title title-1

---

# So why not always use one tail?

.box-inv-1.small.sp-after-half[A one-tailed test is blind on the other side. If the program hurts students, it can't say so]

.box-inv-1.small.sp-after-half[You must pick the side before you see the data. Picking it afterward is really a test at α = 0.10]

.box-1.small[Two tails is our default from now on, unless a problem says otherwise]

???

The second point is the one to land. If you look first and then put all of α on the side the data went, you've quietly doubled your Type I error rate.

class: center middle section-title section-title-6 animated fadeIn

# When we don't know σ

---

layout: true
class: title title-6

---

# So far, z has needed σ

&lt;div class="math-display"&gt;\[
z = \frac{M - \mu}{\sigma_M}
\qquad \text{where} \qquad
\sigma_M = \frac{\sigma}{\sqrt{n}}
\]&lt;/div&gt;

.pull-left[
.box-inv-6.small[Top: how far M is from the mean under H₀]
]

.pull-right[
.box-inv-6.small[Bottom: how far a mean typically falls]
]

.box-6.small[All quarter, someone has told us σ = 15. Who told us?]

???

The standard error's second job from Topic 6: how surprising is this mean, if H₀ is true? In real research nobody hands us σ.

---

# Here's one sample of 10, with σ known

&lt;div class="sim-slide" style="height: 505px;"&gt;
&lt;iframe class="sim-live" src="../simulator/index.html?ui=slide&amp;step=2&amp;n=10&amp;view=stat&amp;draws=1&amp;seed=258921" title="Simulator at step 2 with one sample of ten people drawn. Panel 1 shows the normal population with mean 100 and SD 15. Panel 2 shows the sample, with a mean of 105.5 and a z of 1.17. Panel 3 holds one dot at that z, inside the cutoffs." loading="lazy"&gt;&lt;/iframe&gt;
&lt;img class="sim-static" src="img/sim/749a7017c6ca.png" alt="Simulator at step 2 with one sample of ten people drawn. Panel 1 shows the normal population with mean 100 and SD 15. Panel 2 shows the sample, with a mean of 105.5 and a z of 1.17. Panel 3 holds one dot at that z, inside the cutoffs."&gt;
&lt;/div&gt;

.source[Simulator after Kristoffer Magnusson, rpsychologist.com.]

???

This is step 2 of the blueprint. M is 105.5, z is 1.17, and p is 0.24. About a quarter of samples land this far out, or farther, so it isn't surprising. All of this used σ = 15, from panel 1.

---

# In real research, panel 1 goes dark

&lt;div class="sim-slide" style="height: 505px;"&gt;
&lt;iframe class="sim-live" src="../simulator/index.html?ui=slide&amp;step=3&amp;n=10&amp;draws=1&amp;hide=1&amp;seed=258921" title="Simulator at step 3a with the same sample of ten people. Panel 1 is greyed out and marked with a question mark. Panel 2 shows the same mean of 105.5, with an estimated SD of 11.5 and a t of 1.52. Panel 3 holds one dot at that t." loading="lazy"&gt;&lt;/iframe&gt;
&lt;img class="sim-static" src="img/sim/dd2f70ae8f95.png" alt="Simulator at step 3a with the same sample of ten people. Panel 1 is greyed out and marked with a question mark. Panel 2 shows the same mean of 105.5, with an estimated SD of 11.5 and a t of 1.52. Panel 3 holds one dot at that t."&gt;
&lt;/div&gt;

.source[Simulator after Kristoffer Magnusson, rpsychologist.com.]

???

Same seed, same ten people, same M. This is step 3a. Panel 1 is greyed out, because we can't see the population. It's the picture version of the hat: we've lost σ, so we estimate it from panel 2.

Here σ̂ is 11.55, lower than the true 15. So the standard error shrinks, and the score rises from 1.17 to 1.52. Nothing about the sample changed. Only what we know changed.

---

# So σ̂ takes the place of σ

&lt;div class="math-display"&gt;\[
z = \frac{M - \mu}{\sigma_M}
\qquad \text{becomes} \qquad
t = \frac{M - \mu}{\hat{\sigma}_M}
\]&lt;/div&gt;

.pull-left[
.box-inv-6.small[Only the bottom changes: σ̂&lt;sub&gt;M&lt;/sub&gt; = σ̂ / √n. The hat says it's an estimate]
]

.pull-right[
.box-inv-6.small[The new name warns us: this score behaves a little differently]
]

.book-tag[In the book: σ̂ is written s, and σ̂&lt;sub&gt;M&lt;/sub&gt; is written s&lt;sub&gt;M&lt;/sub&gt;]

???

Greek means population. A Latin letter or a hat means an estimate. μ here is still the value H₀ claims. We haven't seen it either, but we've said what it would be.

---

# Dividing by n − 1 fixes the variance

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; Samples of 5 from our 619 students &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Average across samples &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; The sample's own variance, SS / n &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 12.13 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Our estimate, σ̂² = SS / (n − 1) &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 15.17 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; The truth, σ² &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 15.22 &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-inv-6.small.sp-after-half[SS / n tends to underestimate σ². Dividing by n − 1 gives an unbiased estimate of the variance]

.box-6.small[Then σ̂ is its square root. From here on, n − 1 is the degrees of freedom: df]

.source[Data: Muralidharan, Singh, and Ganimian (2019). 100,000 samples.]

???

A reminder from Topic 3. "Tends to", not "always": some samples overshoot. And it's the variance estimate that's unbiased. Taking the square root makes σ̂ run a little low: here it averages 3.64 against a true σ of 3.90. Say that only if someone asks.

layout: true
class: title title-6

---

# Small samples bring too many surprises

&lt;img src="08-t-test_files/figure-html/beyond-plot-1.png" alt="Bar chart of the share of samples beyond plus or minus 1.96, for samples of 5, 25 and 100, with a dashed line at 5 percent. With the true sigma, every bar is at about 5 percent. With sigma hat, the share is 11.8% at n of 5, 6.1% at n of 25 and 5.3% at n of 100." width="84%" style="display: block; margin: auto;" /&gt;

.box-inv-6.small[As n grows, σ̂ gets closer to σ, and the problem fades]

.source[Data: Muralidharan, Singh, and Ganimian (2019). 100,000 samples of each size.]

???

Same scores, same samples, same cutoff. The only difference is what's in the bottom of the fraction. The dashed line is the 5% we promised.

---

# Why? σ̂ bounces, and often lands low

&lt;img src="08-t-test_files/figure-html/sd-hat-plot-1.png" alt="Histogram of sigma hat across samples of 5 math scores, spread widely from about 1 to 7, with a dashed line at the true sigma of 3.90. About 60% of the samples fall below the line." width="84%" style="display: block; margin: auto;" /&gt;

.box-inv-6.small[60% of samples give a σ̂ below σ. Then the bottom shrinks and the score grows]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

???

With z, the bottom is a fixed number. With t, the bottom changes from sample to sample. That extra wobble is what pushes more scores out into the tails.

---

class: center middle section-title section-title-3 animated fadeIn

# The t-test

---

layout: true
class: title title-3

---

# With n = 5, the pile has fatter tails

&lt;div class="sim-slide" style="height: 505px;"&gt;
&lt;iframe class="sim-live" src="../simulator/index.html?ui=slide&amp;step=3&amp;n=5&amp;draws=5000&amp;hide=1&amp;seed=258921" title="Simulator at step 3a with 5,000 samples of five people and panel 1 greyed out. Panel 3 shows the t-scores stacked along a dashed t curve with 4 degrees of freedom, with cutoffs at minus 2.78 and 2.78." loading="lazy"&gt;&lt;/iframe&gt;
&lt;img class="sim-static" src="img/sim/10970ec2d6c7.png" alt="Simulator at step 3a with 5,000 samples of five people and panel 1 greyed out. Panel 3 shows the t-scores stacked along a dashed t curve with 4 degrees of freedom, with cutoffs at minus 2.78 and 2.78."&gt;
&lt;/div&gt;

.source[Simulator after Kristoffer Magnusson, rpsychologist.com.]

???

Panel 3 no longer uses the normal curve. It's a t curve with n − 1 = 4 degrees of freedom. The cutoffs moved out from ±1.96 to ±2.78, so about 5% of samples land beyond them again. The readout also shows how many land beyond ±1.96: far more than 5%.

Drag n up, press +500, and watch the cutoffs come back toward 1.96.

---

# Fewer degrees of freedom, fatter tails

&lt;img src="08-t-test_files/figure-html/t-curves-1.png" alt="Four panels, each comparing a t curve with the normal curve, for 2, 4, 9 and 29 degrees of freedom. The t curve is lower in the middle and higher in the tails than the normal curve. The gap shrinks as degrees of freedom rise. The two-tailed 5 percent cutoffs are 4.30, 2.78, 2.26 and 2.05." width="94%" style="display: block; margin: auto;" /&gt;

.box-inv-3.small[A family of curves, one for each df. Near df = 30, it's hard to tell from z]

???

Why df and not n? It's n − 1, the number we divided by to get σ̂. The more df, the better σ̂ is, and the closer t gets to z. These curves replace the rpsychologist screenshots from 2024.

# One example, with and without σ

.box-inv-3.small[n = 25, M = 106, SS = 6,144. H₀: μ = 100. α = 0.05, two tails]

&lt;table class="deck-table tight"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; Step &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; If we know σ = 15 &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; If we don't &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 1. State H₀ &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; μ = 100 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; μ = 100 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 2. Set the criteria &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; z beyond ±1.96 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; t(24) beyond ±2.064 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 3. Find the spread &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; σ&lt;sub&gt;M&lt;/sub&gt; = 15 / √25 = 3.00 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; σ̂ = √(6,144 / 24) = 16&lt;br&gt;σ̂&lt;sub&gt;M&lt;/sub&gt; = 16 / √25 = 3.20 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 3. Compute the score &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; z = 6 / 3 = 2.00 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; t = 6 / 3.2 = 1.875 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 4. Decide &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Reject H₀: 2.00 &gt; 1.96 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Maintain H₀: 1.875 &lt; 2.064 &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

# How big is the effect?

---

layout: true
class: title title-5

---

# d says how far apart, in SDs

&lt;img src="08-t-test_files/figure-html/d-plot-1.png" alt="Two normal curves with the same spread. One is centered at 100, the mean under H0, and the other at 113.4, the true mean. An arrow between their centers is labeled d equals 0.89." width="84%" style="display: block; margin: auto;" /&gt;

.box-inv-5.small[Cohen's d = (true μ − H₀ μ) / σ = (113.4 − 100) / 15 = 0.89. It's a parameter: it doesn't depend on n]

???

A review from Topic 7. d is a z-score for a difference: the gap, in standard deviations. Population values all the way through, so d is a population quantity. In the simulator, a slider sets it.

Here again, how do we know that σ? We usually don't.

---

# Hedges' g is the estimate of d

&lt;div class="math-display"&gt;\[
d = \frac{\mu_{\text{true}} - \mu}{\sigma}
\qquad \text{is estimated by} \qquad
g = \frac{M - \mu}{\hat{\sigma}}
\]&lt;/div&gt;

.box-inv-5.small.sp-after-half[In our example: g = (106 − 100) / 16 = **0.375**, so the mean sits about four tenths of an SD above H₀]

.box-5.small[Cohen's rough guide: 0.2 is small, 0.5 is medium, and 0.8 is large]

.book-tag[In the book: g is called the estimated Cohen's d. The book also covers r² here: skip it for now, we come back to it]

???

Same hat logic: a Latin letter for an estimate. g uses σ̂, not σ̂&lt;sub&gt;M&lt;/sub&gt;. It measures distance in people's SDs, not in standard errors, which is why n isn't in the formula.

Some software applies a small-sample correction and also calls that g. We don't. We return to the variance-explained idea, r², in the ANOVA and regression topics.

layout: true
class: title title-7

# You already know the margin of error

.box-7.medium.sp-after-half[A poll: 52% say yes, ± 3 points]

.box-inv-7.small.sp-after-half[Election polls report one, and charts draw it as a band around the line]

.box-inv-7.small.sp-after-half[It's about two standard errors: how far off this estimate might be]

.box-7.small[That's the standard error's first job from Topic 6. Now, for a mean]

???

The poll is the made-up one from Topic 6. This replaces 2024's election screenshots. Topic 6 started from μ and asked where means land. Now we don't know μ, so we start from what we have, M, and go out from there.

---

# An interval: estimate ± margin of error

&lt;div class="math-display"&gt;\[
M \pm z \, \sigma_M
\qquad \text{or} \qquad
M \pm t \, \hat{\sigma}_M
\]&lt;/div&gt;

.pull-left[
.box-inv-7.small[σ known: z = 1.96 for a 95% interval]
]

.pull-right[
.box-inv-7.small[σ unknown: t from the table, n − 1 df]
]

.box-7.small[Use the two-tailed 5% cutoff. Margin of error = cutoff × standard error]

.book-tag[In the book: the second one is M ± t s&lt;sub&gt;M&lt;/sub&gt;]

???

Same ingredients as the test: M, a cutoff and a standard error. They're only arranged differently. The test centers on H₀'s μ. The interval centers on M.

---

# Our example: from 99.40 to 112.60

&lt;img src="08-t-test_files/figure-html/ci-plot-1.png" alt="A number line of possible values of the population mean, with a point at the sample mean of 106 and a bar running from 99.40 to 112.60." width="84%" style="display: block; margin: auto;" /&gt;

.box-inv-7.small.sp-after-half[106 ± 2.064 × 3.2 = 106 ± 6.60]

.box-7.small[We're 95% confident that μ is between 99.40 and 112.60]

???

Thursday's example: n = 25, σ̂ = 16, df = 24. Every value in that range is a value of μ that this sample can't rule out.

# Intervals and tests

---

layout: true
class: title title-4

---

# An interval can run the test for you

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; Step &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; If we know σ = 15 &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; If we don't &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 1. State H₀ &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; μ = 100 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; μ = 100 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 2. Set the criteria &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; 95% interval, z = 1.96 &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; 95% interval, t(24) = 2.064 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 3. Build the interval &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; 106 ± 1.96 × 3.00&lt;br&gt;[100.12, 111.88] &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; 106 ± 2.064 × 3.20&lt;br&gt;[99.40, 112.60] &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 4. Decide &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Reject H₀: 100 isn't inside &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; Maintain H₀: 100 is inside &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-4.small[A 95% interval that leaves out the H₀ mean means rejecting H₀ at α = 0.05, two tails]

???

Same example, same decisions as Thursday. It has to work out this way: M is more than a margin away from μ exactly when the score is beyond the cutoff.

The level has to match: a 95% interval goes with a two-tailed test at α = 0.05, and a 99% interval with α = 0.01.

---

# Only one interval leaves out 100

&lt;img src="08-t-test_files/figure-html/two-ci-plot-1.png" alt="Two horizontal confidence intervals around a mean of 106, with a dashed vertical line at the H0 mean of 100. With sigma known, the interval runs from 100.12 to 111.88 and stops just right of the line. With sigma unknown, it runs from 99.40 to 112.60 and crosses the line." width="84%" style="display: block; margin: auto;" /&gt;

.box-inv-4.small[The t interval is wider, for two reasons: a bigger σ̂ and a bigger cutoff]

???

The left end of the first interval only just clears 100. That's why z was only just past 1.96.

# With a real effect, intervals miss H₀

&lt;div class="sim-slide" style="height: 505px;"&gt;
&lt;iframe class="sim-live" src="../simulator/index.html?ui=slide&amp;tab=intervals&amp;n=25&amp;level=0.95&amp;known=0&amp;d=0.4&amp;draws=500&amp;seed=5" title="Simulator's confidence interval view with 500 intervals from samples of 25 and a true effect d of 0.4. A solid line marks the true mean of 106, and a dashed line marks the H0 mean of 100. Many intervals stop short of the dashed line, which means rejecting H0." loading="lazy"&gt;&lt;/iframe&gt;
&lt;img class="sim-static" src="img/sim/04f11d470926.png" alt="Simulator's confidence interval view with 500 intervals from samples of 25 and a true effect d of 0.4. A solid line marks the true mean of 106, and a dashed line marks the H0 mean of 100. Many intervals stop short of the dashed line, which means rejecting H0."&gt;
&lt;/div&gt;

.source[Simulator after Kristoffer Magnusson, rpsychologist.com.]

???

Here the true effect is d = 0.4, so the true mean really is 106, our example's M. The solid line is the truth, and the dashed line is what H₀ claims.

"Exclude the H₀ mean: reject H₀" is the share of samples that reject. That's power. Our example's sample is one of the many whose interval still holds 100, so maintaining H₀ there was a Type II error in this world. Drag n up to watch the share climb.
