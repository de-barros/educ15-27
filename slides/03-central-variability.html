# Three ways to name a "typical" value

.pull-left-3[
.box-inv-1.medium[Mode]

The most frequent value

Find the value that occurs most often
]

.pull-middle-3[
.box-inv-1.medium[Median]

The midpoint of a distribution

Rank the scores and take the middle one. With an even number, average the middle two
]

.pull-right-3[
.box-inv-1.medium[Mean]

The average, or the balance point

Add up all the scores, then divide by how many there are
]

# The mean: one idea, two symbols

$$
\mu = \frac{\sum X}{N} \qquad\qquad M = \frac{\sum X}{n}
$$

.pull-left[
.box-inv-1.small[Population]

**μ** is the mean of everyone we care about. There are **N** of them
]

.pull-right[
.box-inv-1.small[Sample]

**M** is the mean of the **n** people we observed. It estimates μ
]

.box-1.small[Greek means population. A Latin letter or a hat means an estimate]

???

This rule comes back all quarter. Students should be able to label any symbol as a parameter or an estimate.

&lt;img src="03-central-variability_files/figure-html/skew-order-1.png" alt="Two skewed curves. In the right-skewed curve, the mode is at the peak, the median is to its right, and the mean is farther right, toward the tail. In the left-skewed curve the order is reversed: the mean is farthest left, toward the tail, then the median, then the mode at the peak." width="92%" style="display: block; margin: auto;" /&gt;

.box-inv-6.small[The mean gets pulled toward the tail. That's the perfect score you just saw]

# The standard deviation

---

layout: true
class: title title-3

---

# How far is a typical score from μ?

.box-inv-3.small[Say these five students are everyone we care about, so μ = 12.2]

&lt;table class="deck-table tight"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:center;"&gt; Score X &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Deviation X − μ &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Squared deviation &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:center;"&gt; 8 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; −4.2 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 17.64 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:center;"&gt; 13 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 0.8 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 0.64 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:center;"&gt; 12 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; −0.2 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 0.04 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:center;"&gt; 12 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; −0.2 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 0.04 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:center;"&gt; 16 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 3.8 &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; 14.44 &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-3.small[Add up the last column to get the sum of squares: SS = 32.8]

???

Why square? Deviations from the mean always add up to zero, so their plain average tells us nothing.

---

# Four steps to the standard deviation

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt; Step &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; In symbols &lt;/th&gt;
   &lt;th style="text-align:left;"&gt; Our five students &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 1. Find each deviation &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; \(X - \mu\) &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; The table we just built &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 2. Square them and add them up &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; \(SS = \sum (X - \mu)^2\) &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; SS = 32.8 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 3. Average them: the variance &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; \(\sigma^2 = SS / N\) &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; 32.8 / 5 = 6.56 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; 4. Take the root: the SD &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; \(\sigma = \sqrt{\sigma^2}\) &lt;/td&gt;
   &lt;td style="text-align:left;"&gt; √6.56 = 2.56 &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-3.small[Variance is the average squared distance. The SD puts it back in points]

---

# We rarely see the whole population

&lt;img src="03-central-variability_files/figure-html/spread-plot-1.png" alt="Bar chart of all 619 baseline math scores, spanning 0 to 26, with five dark diamonds below it showing one random sample of five students. The five diamonds cover a narrower span than the full set of scores." width="86%" style="display: block; margin: auto;" /&gt;

.box-inv-3.small[A small sample rarely catches the extreme scores, so it tends to look less spread out than its population]

.source[Data: Muralidharan, Singh, and Ganimian (2019).]

# Predict it: SS / n falls short on average

&lt;img src="03-central-variability_files/figure-html/bias-plot-1.png" alt="Two histograms of an estimate of the variance across 5,000 samples of 5 students, with a vertical line at the true value of 15.22. Dividing by n has an average of about 12, well below the true value. Dividing by n minus 1 has an average of about 15, close to the true value." width="92%" style="display: block; margin: auto;" /&gt;

.box-inv-8.small[SS / n tends to be too small, though 28% of samples still overshoot. Dividing by n − 1 lands on target on average]

.source[Data: Muralidharan, Singh, and Ganimian (2019). Samples drawn from those scores.]

---

layout: true
class: title title-3

---

# Our estimate of the population variance

$$
\hat{\sigma}^2 = \frac{SS}{n - 1} \qquad\qquad \hat{\sigma} = \sqrt{\hat{\sigma}^2}
$$

.pull-left[
.box-inv-3.small[
The hat says this is an estimate. n − 1 is called the *degrees of freedom*
]
]

.pull-right[
.box-inv-3.small[
SS / n is still the sample's own variance. It just isn't our best guess about the population
]
]

.book-tag[In the book: σ̂² is written s², and σ̂ is written s]

???

The variance estimate is unbiased. Its square root runs a little low: here it averages 3.61 against a true SD of 3.90. That's worth saying only if someone asks.

---

# Our five students, now as a sample

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt;   &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Population &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Sample &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; How many &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; N &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; n = 5 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Mean &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; μ &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; M = 12.2 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Variance &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; σ² = SS / N &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; σ̂² = 32.8 / 4 = 8.20 &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; Standard deviation &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; σ &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; σ̂ = 2.86 &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-3.small[With all 619 students, n − 1 hardly matters: σ̂ = 3.90, against 3.90 when dividing by n]

# Bonus: A faster way to compute SS

.small[Start from the definition, multiply out the square, and use μ = ΣX / N:]

$$
SS = \sum (X - \mu)^2 = \sum X^2 - 2\mu \sum X + N\mu^2
$$

$$
SS = \sum X^2 - \frac{(\sum X)^2}{N}
$$

.box-inv-3.small[This needs no deviations, so it's quicker with a calculator]
