# We use data to estimate the truth

$$
X \;\rightarrow\; M = \frac{\sum X}{n} \;\rightarrow\; \hat{\mu} \;\overset{\text{hopefully}}{\longrightarrow}\; \mu
$$

&lt;table class="deck-table"&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:center;"&gt; Data &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Calculation &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Estimate &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; Truth &lt;/th&gt;
  &lt;/tr&gt;
 &lt;/thead&gt;
&lt;tbody&gt;
  &lt;tr&gt;
   &lt;td style="text-align:center;"&gt; The scores we saw &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; The mean of those scores &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; Our best guess about the population &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; The population's real mean &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;

.box-6.small[A *parameter* describes a population. A *statistic* describes a sample]

.center.small[Greek means population. A Latin letter or a hat means an estimate]

  const preParents = [];
  const findPreParent = function(line, p = 0) {
    if (p > 1) return null; // traverse up no further than grandparent
    const el = line.parentElement;
    return el.tagName === "PRE" ? el : findPreParent(el, ++p);
  };

  for (let line of hlines) {
    let pre = findPreParent(line);
    if (pre && !preParents.includes(pre)) preParents.push(pre);
  }
  preParents.forEach(p => p.classList.add("remark-code-has-line-highlighted"));

<script>
slideshow._releaseMath = function(el) {
  var i, text, code, codes = el.getElementsByTagName('code');
  for (i = 0; i < codes.length;) {
    code = codes[i];
    if (code.parentNode.tagName !== 'PRE' && code.childElementCount === 0) {
      text = code.textContent;
      if (/^\\\((.|\s)+\\\)$/.test(text) || /^\\\[(.|\s)+\\\]$/.test(text) ||
          /^\$\$(.|\s)+\$\$$/.test(text) ||
          /^\\begin\{([^}]+)\}(.|\s)+\\end\{[^}]+\}$/.test(text)) {
        code.outerHTML = code.innerHTML;  // remove <code></code>
        continue;
      }
    }
    i++;
  }
};
slideshow._releaseMath(document);
