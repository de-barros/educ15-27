<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Simulator check</title>
</head>
<body>
<!-- Opens every simulator preset the decks use, reads the readouts, presses the
     buttons and reads them again. Serve the repo root over HTTP and open
     tests/sim-qa.html, or run tests/check-sim.sh. The output is the baseline for
     showing that a change to the tool leaves its defaults alone. -->
<pre id="out">running</pre>
<iframe id="sim" title="Simulator under test" style="width: 1180px; height: 545px; border: 0;"></iframe>
<script>
(async function () {
  const out = document.getElementById("out"), frame = document.getElementById("sim");
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const decks = ["04-z-scores", "05-probability", "06-sampling-distributions", "07-hypothesis-testing",
    "08-t-test", "09-two-samples-gains", "10-anova", "11-correlation", "12-regression-line",
    "13-regression-inference", "14-regression-groups", "00-template"];

  const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; };

  function read(win, tab) {
    const text = id => {
      const el = win.document.getElementById(id);
      return el ? el.textContent.replace(/\s+/g, " ").trim() : "";
    };
    const ids = { blueprint: ["readout", "cap-sample", "cap-dist"], power: ["p-readout", "cap-power"],
                  intervals: ["ci-readout", "cap-ci"], correlation: ["r-readout", "cap-corr"] }[tab];
    const state = {};
    ids.forEach(id => { state[id] = text(id); });
    return state;
  }

  function pixels(win) {
    return Array.from(win.document.querySelectorAll("canvas"))
      .filter(c => c.width && c.offsetParent !== null && c.id !== "c-fx")
      .map(c => c.id + ":" + hash(c.toDataURL()));
  }

  const results = [];
  for (const deck of decks) {
    const res = await fetch("../slides/" + deck + ".html", { cache: "reload" });
    if (!res.ok) continue;
    const doc = new DOMParser().parseFromString(await res.text(), "text/html");
    const src = doc.getElementById("source").value;
    const slides = src.split(/\n---\n/);
    let n = 0;
    for (const slide of slides) {
      if (/^\s*layout:\s*true/.test(slide)) continue;
      n += 1;
      const found = slide.match(/simulator\/index\.html\?([^"]+)"/);
      if (!found) continue;
      const query = found[1].replace(/&amp;/g, "&");
      const tab = (query.match(/tab=(\w+)/) || [0, "blueprint"])[1];
      frame.src = "../simulator/index.html?" + query;
      await new Promise(r => { frame.onload = r; });
      await wait(700);
      const win = frame.contentWindow;
      const row = { deck: deck, slide: n, title: (slide.match(/^# (.+)$/m) || [0, ""])[1], query: query,
                    opened: read(win, tab), pixels: pixels(win), pressed: {} };
      const buttons = { blueprint: ["draw-1", "draw-50", "clear"], intervals: ["ci-1", "ci-50", "ci-clear"],
                        correlation: ["r-new"], power: [] }[tab];
      for (const id of buttons) {
        win.document.getElementById(id).click();
        await wait(350);
        row.pressed[id] = read(win, tab);
      }
      results.push(row);
    }
  }
  out.textContent = JSON.stringify(results, null, 1);
  document.title = "done";
})().catch(e => { document.getElementById("out").textContent = "ERROR " + e; document.title = "done"; });
</script>
</body>
</html>
